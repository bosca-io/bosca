<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">Kit conversation and runtime responsibilities</title>
  <desc id="description">Clients send conversation operations to the Bosca API. PostgreSQL stores durable state. Background Runner jobs drive a supervisor and native harness in a Kubernetes Job or Swarm Service. The Runner verifies and commits archives in private object storage. The harness calls providers and MCP tools; its Bosca MCP connection calls the Bosca API.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#0f172a"/>
  <g fill="#17243a" stroke="#475569" stroke-width="1.5">
    <rect x="28" y="32" width="220" height="110" rx="10"/>
    <rect x="350" y="32" width="250" height="110" rx="10"/>
    <rect x="704" y="32" width="228" height="110" rx="10"/>
    <rect x="28" y="238" width="220" height="112" rx="10"/>
    <rect x="350" y="238" width="250" height="112" rx="10"/>
    <rect x="350" y="432" width="250" height="100" rx="10"/>
    <rect x="704" y="205" width="228" height="270" rx="10" stroke="#60a5fa"/>
    <rect x="720" y="250" width="196" height="70" rx="8"/>
    <rect x="720" y="365" width="196" height="75" rx="8"/>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M248 88 H350"/>
    <path d="M600 88 H704"/>
    <path d="M475 142 V238"/>
    <path d="M600 294 H704"/>
    <path d="M350 294 H248" marker-start="url(#arrow)"/>
    <path d="M818 320 V365"/>
    <path d="M818 475 V492 H600"/>
  </g>
  <g fill="#e2e8f0" font-family="system-ui, sans-serif" text-anchor="middle">
    <g font-size="19" font-weight="650">
      <text x="138" y="68">Studio / CLI clients</text>
      <text x="475" y="68">Bosca API</text>
      <text x="818" y="68">PostgreSQL</text>
      <text x="138" y="276">Private object store</text>
      <text x="475" y="276">Runner</text>
      <text x="475" y="469">Providers + MCP tools</text>
      <text x="818" y="279">CLI supervisor</text>
      <text x="818" y="397">Native harness</text>
    </g>
    <g font-size="14" fill="#cbd5e1">
      <text x="138" y="96">Messages, choices, approvals</text>
      <text x="475" y="96">Identity and API permissions</text>
      <text x="818" y="96">History, turns, approvals,</text>
      <text x="818" y="118">ownership, archive inventory</text>
      <text x="138" y="304">Verified file archives</text>
      <text x="475" y="304">Context, ACP, reconciliation,</text>
      <text x="475" y="326">archive verification + commit</text>
      <text x="475" y="497">Model work and tool operations</text>
      <text x="818" y="229" fill="#93c5fd">Job or Service · one generation</text>
      <text x="818" y="301">Fencing, receipts, file state</text>
      <text x="818" y="422">History, context, tool selection</text>
      <text x="818" y="460">Bosca MCP calls the API</text>
    </g>
    <g font-size="13" fill="#94a3b8">
      <text x="298" y="68">requests</text>
      <text x="652" y="68">persist</text>
      <text x="543" y="192">background jobs</text>
      <text x="651" y="274">control / ACP</text>
      <text x="299" y="274">archives</text>
      <text x="859" y="347">ACP stdio</text>
      <text x="702" y="518">native calls</text>
    </g>
  </g>
</svg>
