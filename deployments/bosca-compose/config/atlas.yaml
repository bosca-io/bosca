packages: [security-initial, git-search-index, github, default-artifact-sync-pipelines]

bosca:
  server:
    port: 8094
    development: false

database:
  postgres:
    url: jdbc:postgresql://postgres:5432/bosca
    user: bosca
    password: $DATABASE_PASSWORD
    maxConnections: 10

cache:
  type: nats
jobQueue:
  factory: nats
pubsub:
  type: nats
distributedLock:
  type: nats
counter:
  type: nats
nats:
  url: nats://nats:4222
  token: $NATS_TOKEN
  maxConnections: 2

jwt:
  domain: $BOSCA_DOMAIN
  admin-domain: $BOSCA_DOMAIN
  audience: Bosca
  realm: Bosca
  issuer: $BOSCA_DOMAIN
  secret: $JWT_SECRET
  expiration-time: 2592000
  cookie-secure: ${JWT_COOKIE_SECURE:false}
  cookie-prefixes: []

security:
  autoVerify: ${SECURITY_AUTO_VERIFY:false}
  encryption:
    key: $SECURITY_ENCRYPTION_KEY

app:
  url: $ATLAS_URL
  allowed-origins:
    - $ATLAS_URL
  welcome-url: "${WELCOME_EMAIL_URL:}"

oauth2:
  providers:
    - type: google
      clientId: ${GOOGLE_CLIENT_ID:}
      clientSecret: ${GOOGLE_CLIENT_SECRET:}
      callback: $OAUTH2_GOOGLE_REDIRECT
      adminCallback: $OAUTH2_GOOGLE_ADMIN_REDIRECT
      authorizeUrl: https://accounts.google.com/o/oauth2/auth
      accessTokenUrl: https://accounts.google.com/o/oauth2/token
      userInfoUrl: https://www.googleapis.com/oauth2/v1/userinfo
      scopes:
        - https://www.googleapis.com/auth/userinfo.profile
        - https://www.googleapis.com/auth/userinfo.email
      enabled: ${GOOGLE_ENABLED:true}
  redirects:
    - $ATLAS_URL

webauthn:
  extraOrigins:
    - $ATLAS_URL

git:
  url: $GIT_URL
  ui:
    url: $ATLAS_URL
  sync:
    listeners: false
atlas:
  api:
    enabled: true
  git:
    enabled: true
  artifacts:
    enabled: true
  ui:
    enabled: ${ATLAS_UI_ENABLED:true}
    server:
      port: 8095
      development: false
  runner:
    enabled: ${ATLAS_RUNNER_ENABLED:false}
    listeners: false
initialization:
  password:
    admin: $INIT_ADMIN_PASSWORD
    sa: $INIT_SA_PASSWORD
pipeline:
  secretKey: $PIPELINE_SECRET_KEY

meilisearch:
  url: http://meilisearch:7700
  apiKey: $MEILISEARCH_API_KEY

content:
  images:
    resizer:
      url: http://127.0.0.1:8003
      sizes: []
  storage:
    type: fs
    basePath: /storage
    urlPrefix: $APP_URL
    urlUploadPrefix: $APP_URL
  urlSigner:
    secretKey: $STORAGE_URL_SIGNER_SECRET_KEY

analyticsServer:
  appId: bosca-atlas-server
  url: $APP_URL
analyticsProcessor:
  enabled: false
embedding:
  enabled: false
scheduler:
  enabled: false
runners:
  enabled: []
