packages:
  - "security-initial"
  - "git-search-index"
  - "github"
  - "default-artifact-sync-pipelines"

bosca:
  server:
    port: "${ATLAS_HTTP_PORT:8094}"
    development: "${ATLAS_DEVELOPMENT:false}"

database:
  postgres:
    url: "${DATABASE_URL:jdbc:postgresql://localhost:5433/bosca}"
    user: "${DATABASE_USER:bosca}"
    password: "${DATABASE_PASSWORD:bosca}"
    maxConnections: "${DATABASE_MAX_CONNECTIONS:20}"

cache:
  type: "$CACHE_TYPE:nats"

jobQueue:
  factory: "$JOB_QUEUE_FACTORY:nats"

pubsub:
  type: "$PUBSUB_TYPE:nats"

distributedLock:
  type: "$DISTRIBUTED_LOCK_TYPE:nats"

redis:
  host: "$REDIS_HOST:localhost"
  port: ${REDIS_PORT:6380}
  database: ${REDIS_DATABASE:0}
  namespace: "$REDIS_NAMESPACE:"

nats:
  url: "$NATS_HOST:localhost:4222"
  token: "$NATS_TOKEN:OAVKZTG7ST62YCPUJYJ6LBQDMKLAUD4NRBPZ4GXUXNUJW2ATCFKKYGHV"
  username: "$NATS_USERNAME:"
  password: "$NATS_PASSWORD:"

counter:
  type: "$COUNTER_TYPE:nats"

jwt:
  domain: "$JWT_DOMAIN:localhost"
  admin-domain: "$JWT_ADMIN_DOMAIN:localhost"
  audience: "$JWT_AUDIENCE:Bosca"
  realm: "$JWT_REALM:Bosca"
  issuer: "$JWT_ISSUER:Bosca"
  secret: "$JWT_SECRET:c534b2595b38f5d9cb33f8cd05996c95"
  cookie-secure: ${JWT_COOKIE_SECURE:false}
  expiration-time: ${JWT_EXPIRATION_TIME:2592000}
  cookie-prefixes: []

security:
  autoVerify: ${SECURITY_AUTO_VERIFY:false}

analyticsServer:
  appId: "$ANALYTICS_APP_ID:bosca-atlas-server"
  url: "$ANALYTICS_SERVER_URL:http://localhost:8081"

app:
  url: "${APP_URL:http://localhost:8095}"
  allowed-origins:
    - "${APP_ALLOWED_ORIGIN:http://localhost:8095}"
  welcome-url: "${WELCOME_EMAIL_URL:}"

oauth2:
  providers:
    - type: google
      clientId: ${GOOGLE_CLIENT_ID:}
      clientSecret: ${GOOGLE_CLIENT_SECRET:}
      callback: "${OAUTH2_GOOGLE_REDIRECT:http://localhost:8094/oauth2/google/callback}"
      adminCallback: "${OAUTH2_GOOGLE_ADMIN_REDIRECT:http://localhost:8094/oauth2/google/callback}"
      authorizeUrl: https://accounts.google.com/o/oauth2/auth
      accessTokenUrl: https://accounts.google.com/o/oauth2/token
      userInfoUrl: https://www.googleapis.com/oauth2/v1/userinfo
      scopes:
        - https://www.googleapis.com/auth/userinfo.profile
        - https://www.googleapis.com/auth/userinfo.email
      enabled: ${GOOGLE_ENABLED:true}
  redirects:
    - "${OAUTH2_ALLOWED_REDIRECT:http://localhost:8095}"

webauthn:
  extraOrigins:
    - "${WEBAUTHN_EXTRA_ORIGIN:}"

graphql:
  introspection:
    enabled: "${GRAPHQL_INTROSPECTION_ENABLED:false}"

git:
  sync:
    listeners: "${ATLAS_SYNC_LISTENERS_ENABLED:true}"
  url: "${GIT_URL:http://localhost:8094}"
  ui:
    url: "${GIT_UI_URL:http://localhost:8095}"

pipeline:
  secretKey: "$PIPELINE_SECRET_KEY:dGhpcy1pcy1hLWRldi1vbmx5LXNlY3JldC1rZXktMzI="

meilisearch:
  url: "$MEILISEARCH_URL:http://localhost:7701"
  apiKey: "$MEILISEARCH_API_KEY:p8JcB_HuMHRxN7uVXfrG2wU06b5k7oTvaAAYo6nsi9M"
  indexPrefix: "$MEILISEARCH_INDEX_PREFIX:"

content:
  storage:
    type: "$STORAGE_TYPE:s3"
    bucket: "$STORAGE_BUCKET:storage"
    urlUploadPrefix: "$STORAGE_URL_UPLOAD_PREFIX:http://localhost:8080"
    forcePathStyle: ${STORAGE_FORCE_PATH_STYLE:true}
    region: "$STORAGE_REGION:us-east-1"
    urlPrefix: "$STORAGE_URL_PREFIX:http://localhost:8080"
    endpoint: "$STORAGE_ENDPOINT:http://localhost:8000"
    accessKeyId: "$STORAGE_ACCESS_KEY_ID:bosca-s3"
    accessKeySecret: "$STORAGE_ACCESS_KEY_SECRET:bosca-s3"
  urlSigner:
    secretKey: "$STORAGE_URL_SIGNER_SECRET_KEY:10df7d451e8365cd6a8d43d408a25c82"

atlas:
  api:
    enabled: "${ATLAS_API_ENABLED:true}"
  git:
    enabled: "${ATLAS_GIT_ENABLED:true}"
  artifacts:
    enabled: "${ATLAS_ARTIFACTS_ENABLED:true}"
  ui:
    enabled: "${ATLAS_UI_ENABLED:true}"
    auth-cookie-prefix: "${BML_AUTH_COOKIE_PREFIX:}"
    server:
      port: "${ATLAS_UI_HTTP_PORT:8095}"
      development: "${ATLAS_UI_DEVELOPMENT:false}"
  runner:
    enabled: "${ATLAS_RUNNER_ENABLED:true}"
    concurrency: "${ATLAS_RUNNER_CONCURRENCY:16}"
    queues: "${ATLAS_RUNNER_QUEUES:git,pipelines,common}"
    listeners: "${ATLAS_RUNNER_LISTENERS_ENABLED:true}"

scheduler:
  enabled: "${ATLAS_SCHEDULER_ENABLED:true}"
