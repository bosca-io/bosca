connector.name=postgresql
connection-url=jdbc:postgresql://postgres:5432/bosca
connection-user=bosca
connection-password=bosca
# Expose PostgreSQL array columns (e.g. metadata.labels text[]) as Trino arrays. The default (DISABLED)
# hides array columns entirely, so a query referencing them fails with "column cannot be resolved" —
# which breaks the recommender's content-features training query (array_join(m.labels, ...)).
postgresql.array-mapping=AS_ARRAY
