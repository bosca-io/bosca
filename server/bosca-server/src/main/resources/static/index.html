<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosca</title>
    <style>
        :root {
            --primary: #00dc82;
            --primary-dark: #00c16a;
            --bg: #09090b; /* Neutral Dark Gray (Zinc-950) */
            --text: #fafafa;
            --text-muted: #a1a1aa;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.08);
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text);
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 480px;
            width: 100%;
            z-index: 10;
        }
        .logo-container {
            width: 96px;
            height: 96px;
            margin: 0 auto 1.5rem;
            filter: drop-shadow(0 0 15px rgba(0, 220, 130, 0.15));
        }
        h1 {
            font-size: 2.75rem;
            font-weight: 800;
            margin: 0 0 0.5rem;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #fff, #c8c8c8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .description {
            color: var(--text-muted);
            font-size: 1.125rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .links a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .links a:hover {
            background: rgba(0, 220, 130, 0.05);
            border-color: rgba(0, 220, 130, 0.4);
            color: var(--primary);
            transform: translateY(-1px);
        }
        .glow {
            position: absolute;
            width: 60vw;
            height: 60vw;
            max-width: 800px;
            max-height: 800px;
            background: radial-gradient(circle, rgba(0, 220, 130, 0.08) 0%, rgba(0, 220, 130, 0) 70%);
            z-index: -1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .footer {
            position: fixed;
            bottom: 2rem;
            width: 100%;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <div class="logo-container">
            <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M256 262L491 138L256 21L21 138L256 262Z" fill="#00c16a"/>
                <path d="M491 138L256 262V498L491 372V138Z" fill="#00dc82"/>
                <path d="M21 138L256 262V498L21 372V138Z" fill="#00a155"/>
            </svg>
        </div>
        <h1>Bosca</h1>
        <p class="description">Build content systems that learn from every interaction</p>
        <div class="links">
            <a href="https://bosca.io" target="_blank">Visit bosca.io</a>
            <a href="https://bosca.io/docs" target="_blank">Documentation</a>
        </div>
    </div>
    <div class="footer">
        © 2026 Bosca. All rights reserved.
    </div>
</body>
</html>
