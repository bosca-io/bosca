bosca:
  server:
    port: ${BOSCA_SERVER_PORT:8060}
    development: ${BOSCA_DEVELOPMENT:true}

cors:
  allowAnyHost: "$CORS_ALLOW_ANY_HOST:true"
  allowCredentials: "$CORS_ALLOW_CREDENTIALS:true"
  anyMethod: "$CORS_ANY_METHOD:true"
  maxAgeSeconds: "$CORS_MAX_AGE_SECONDS:86400"
  allowedHeaders:
    - X-BA-Session-ID
    - Content-Type
    - Content-Length
    - Content-Range
    - Content-Disposition
    - Authorization
    - Cookie

jwt:
  domain: "$JWT_DOMAIN:localhost"
  admin-domain: "$JWT_ADMIN_DOMAIN:localhost"
  audience: "$JWT_AUDIENCE:Bosca"
  realm: "$JWT_REALM:Bosca"
  issuer: "$JWT_ISSUER:Bosca"
  secret: "$JWT_SECRET:c534b2595b38f5d9cb33f8cd05996c95"
  cookie-secure: ${JWT_COOKIE_SECURE:false}
  expiration-time: ${JWT_EXPIRATION_TIME:3600}

security:
  autoVerify: ${SECURITY_AUTO_VERIFY:true}
  encryption:
    key: "$SECURITY_ENCRYPTION_KEY:changeme"

introspection:
  enabled: ${INTROSPECTION_ENABLED:true}

mcp:
  enabled: ${MCP_ENABLED:true}

content:
  storage:
    type: "$STORAGE_TYPE:s3"
    bucket: "$STORAGE_BUCKET:storage"
    urlUploadPrefix: "$STORAGE_URL_UPLOAD_PREFIX:http://localhost:8080"
    forcePathStyle: ${STORAGE_FORCE_PATH_STYLE:true}
    region: "$STORAGE_REGION:us-east-1"
    urlPrefix: "$STORAGE_URL_PREFIX:http://localhost:8080"
    endpoint: "$STORAGE_ENDPOINT:http://localhost:8000"
    accessKeyId: "$STORAGE_ACCESS_KEY_ID:bosca-s3"
    accessKeySecret: "$STORAGE_ACCESS_KEY_SECRET:bosca-s3"
  urlSigner:
    secretKey: "$STORAGE_URL_SIGNER_SECRET_KEY:10df7d451e8365cd6a8d43d408a25c82"
  index:
    batchSize: ${CONTENT_INDEX_BATCH_SIZE:100}
    excludeTypes:
      - Study Step
      - Daily Day
      - OBS Step
      - Banner
      - Standalone Page
    excludeContentTypePrefix:
      - image/
      - application/
  images:
    resizer:
      url: "$IMAGE_RESIZER_URL:http://localhost:8003"
      sizes:
        - name: thumbnail
          ratio: 25
          size:
            height: 270
            width: 480
        - name: small
          ratio: 50
          size:
            height: 540
            width: 960
        - name: medium
          ratio: 75
          size:
            height: 810
            width: 1440
        - name: large
          ratio: 100
          size:
            height: 1080
            width: 1920
        - name: thumbnail-original
          ratio: 25
        - name: small-original
          ratio: 50
        - name: medium-original
          ratio: 75
        - name: large-original
          ratio: 100

database:
  migrations:
    - core-migrations
    - scheduler-migrations
  postgres:
    url: "$DATABASE_URL:jdbc:postgresql://localhost:5433/bosca"
    user: "$DATABASE_USER:bosca"
    password: "$DATABASE_PASSWORD:bosca"
  trino-admin:
    url: "$TRINO_DATABASE_URL:jdbc:trino://localhost:8089"
    user: "$TRINO_DATABASE_USER:admin"
    password: "$TRINO_DATABASE_PASSWORD:"
    driverClassName: "io.trino.jdbc.TrinoDriver"
  trino-readonly:
    url: "$TRINO_DATABASE_URL:jdbc:trino://localhost:8089"
    user: "$TRINO_DATABASE_READONLY_USER:rouser"
    password: "$TRINO_DATABASE_READONLY_PASSWORD:"
    driverClassName: "io.trino.jdbc.TrinoDriver"

initialization:
  password:
    admin: "$INIT_ADMIN_PASSWORD:password"
    sa: "$INIT_SA_PASSWORD:sa-password"

# Chat providers include the durable notification executors and profile-cleanup handlers. Keep
# this gate in parity with bosca-server so jobs enqueued by an enabled chat API have consumers.
chat:
  enabled: "${CHAT_ENABLED:true}"

community:
  enabled: ${COMMUNITY_ENABLED:true}

# Ecommerce (companies, catalogs, products, carts, payments, subscriptions,
# fulfillment, the ecom queue runner and scheduled jobs). Defaults off; set
# ECOMMERCE_ENABLED=true in deployments that sell to pull in the ecom providers,
# migrations, and the ecomQueueRunner.
ecommerce:
  enabled: "${ECOMMERCE_ENABLED:false}"

# Semantic content embeddings for the recommender. Off unless the text-embeddings-inference sidecar (and its
# gated EmbeddingGemma model) is deployed; bosca-runner computes the embedding at index time. The URL
# defaults to the in-cluster sidecar service.
embedding:
  enabled: "${EMBEDDINGS_ENABLED:false}"
  url: "${BOSCA_EMBEDDINGS_URL:http://text-embeddings-inference:80}"

# TensorFlow Serving endpoint for recommendation models; the default matches the code default.
recommendations:
  tfServing:
    url: "$RECOMMENDATIONS_TF_SERVING_URL:http://tf-serving:8501"

kubernetes:
  enabled: "${KUBERNETES_ENABLED:false}"

# The runner owns git-sync pull listening (agents, pipelines, scripts, analytics
# queries) — exactly one root per deployment should listen.
git:
  ci:
    # Comma-separated JobProfile names. Blank preserves ordinary polling agents.
    kubernetesJobProfiles: "$CI_KUBERNETES_JOB_PROFILES:"
  sync:
    listeners: ${GIT_SYNC_LISTENERS:true}

redis:
  host: "$REDIS_HOST:localhost"
  port: ${REDIS_PORT:6380}
  database: ${REDIS_DATABASE:0}
  namespace: "$REDIS_NAMESPACE:"

nats:
  url: "$NATS_HOST:localhost:4222"
  token: "$NATS_TOKEN:OAVKZTG7ST62YCPUJYJ6LBQDMKLAUD4NRBPZ4GXUXNUJW2ATCFKKYGHV"
  username: "$NATS_USERNAME:"
  password: "$NATS_PASSWORD:"

natsMonitoring:
  monitoringUrl: "$NATS_MONITORING_URL:http://localhost:8222"

cache:
  type: "$CACHE_TYPE:nats"

experimentation:
  eventsTable: "$EXPERIMENTATION_EVENTS_TABLE:warehouse.bosca.events"
  assignmentsTable: "$EXPERIMENTATION_ASSIGNMENTS_TABLE:bosca.experimentation.assignments"
  postgresCatalog: "$EXPERIMENTATION_POSTGRES_CATALOG:bosca"

jobQueue:
  factory: "$JOB_QUEUE_FACTORY:nats"

pubsub:
  type: "$PUBSUB_TYPE:nats"

distributedLock:
  type: "$DISTRIBUTED_LOCK_TYPE:nats"

mailer:
  type: "$MAILER_TYPE:sendgrid"
  from:
    name: "$MAILER_FROM_NAME:Bosca"
    email: "$MAILER_FROM_EMAIL:noreply@example.com"
  # Public pages minted unsubscribe tokens are appended to (?token=...) for BML email
  # renders; blank disables unsubscribe-link minting.
  unsubscribeUrl: "$MAILER_UNSUBSCRIBE_URL:"
  preferencesUrl: "$MAILER_PREFERENCES_URL:"

# Public origin of the Studio web app. Auth email links (verify, reset password, account-link)
# route back to the host the user came from when it is listed in `allowed-origins` (multi-host);
# `url` is the fallback used when the host is unknown or not allow-listed.
app:
  url: "$APP_URL:http://localhost:3000"
  # Blank falls back to `app.url`; set this to the account-security page used by alert emails.
  security-alert-url: "$SECURITY_ALERT_URL:"
  # Blank falls back to `${app.url}/welcome`; set WELCOME_EMAIL_URL for another onboarding entry.
  welcome-url: "$WELCOME_EMAIL_URL:"
  allowed-origins:
    - "$APP_ALLOWED_ORIGIN:http://localhost:3000"

meilisearch:
  url: "$MEILISEARCH_URL:http://localhost:7701"
  apiKey: "$MEILISEARCH_API_KEY:p8JcB_HuMHRxN7uVXfrG2wU06b5k7oTvaAAYo6nsi9M"
  indexPrefix: "$MEILISEARCH_INDEX_PREFIX:"

oauth2:
  providers:
    - type: google
      clientId: ${GOOGLE_CLIENT_ID:}
      clientSecret: ${GOOGLE_CLIENT_SECRET:}
      callback: "$OAUTH2_GOOGLE_REDIRECT:http://localhost:8080/oauth2/google/callback"
      adminCallback: "$OAUTH2_GOOGLE_ADMIN_REDIRECT:http://localhost:8080/oauth2/google/callback"
      authorizeUrl: https://accounts.google.com/o/oauth2/auth
      accessTokenUrl: https://accounts.google.com/o/oauth2/token
      userInfoUrl: https://www.googleapis.com/oauth2/v1/userinfo
      scopes:
        - https://www.googleapis.com/auth/userinfo.profile
        - https://www.googleapis.com/auth/userinfo.email
      enabled: true
    - type: facebook
      clientId: ${FACEBOOK_CLIENT_ID:}
      clientSecret: ${FACEBOOK_CLIENT_SECRET:}
      callback: "$OAUTH2_FACEBOOK_REDIRECT:http://localhost:8080/oauth2/facebook/callback"
      adminCallback: "$OAUTH2_FACEBOOK_ADMIN_REDIRECT:http://localhost:8080/oauth2/facebook/callback"
      authorizeUrl: https://www.facebook.com/v19.0/dialog/oauth
      accessTokenUrl: https://graph.facebook.com/v19.0/oauth/access_token
      userInfoUrl: https://graph.facebook.com/me
      scopes:
        - public_profile
        - email
      enabled: false
  redirects:
    - "$OAUTH2_ALLOWED_REDIRECT:http://localhost:8080"
    - "http://localhost:3000"

analyticsProcessor:
  enabled: "$ANALYTICS_PROCESSOR_ENABLED:false"

analyticsServer:
  appId: "$ANALYTICS_APP_ID:bosca-runner"

iceberg:
  catalog: "$ICEBERG_CATALOG:bosca"
  fileIO: org.apache.iceberg.aws.s3.S3FileIO
  namespace: "$ICEBERG_NAMESPACE:bosca"
  table: "$ICEBERG_TABLE:events"
  localPath: "$ICEBERG_LOCAL_PATH:./data/iceberg"
  warehouseLocation: "$ICEBERG_WAREHOUSE_LOCATION:s3://warehouse/warehouse"
  database:
    uri: "$ICEBERG_DATABASE_URI:jdbc:postgresql://localhost:5434/bosca-warehouse"
    username: "$ICEBERG_DATABASE_USER:bosca-warehouse"
    password: "$ICEBERG_DATABASE_PASSWORD:bosca-warehouse"
  s3:
    bucket: "$ICEBERG_S3_BUCKET:bosca-warehouse"
    region: "$ICEBERG_S3_REGION:us-east-1"
    endpoint: "$ICEBERG_S3_ENDPOINT:http://localhost:8000"
    pathStyleAccess: ${ICEBERG_S3_PATH_STYLE_ACCESS:true}
    accessKeyId: "$ICEBERG_S3_ACCESS_KEY:bosca-s3"
    secretAccessKey: "$ICEBERG_S3_SECRET_KEY:bosca-s3"

packages: [core, security-initial, profiles, languages, search-index, root-collection-installer, bible, community-ai, ai, kit, docs, maintenance, analytics-queries, hubspot]

runners:
  enabled:
    - indexQueueRunner
    - messagesJobQueueRunner
    - contentQueueRunner
    - profileQueueRunner
    - communityRunner
    - commonQueueRunner
    - gitQueueRunner
    - workopsQueueRunner
    - analyticsQueueRunner
    - scriptingQueueRunner
    - backupQueueRunner
    - segmentationQueueRunner
    - experimentationQueueRunner
    - formsJobQueueRunner
    - pipelinesQueueRunner
    - ecomQueueRunner
    - feedsQueueRunner

google:
  tts:
    account: "$GOOGLE_TTS_ACCOUNT:"
  genai:
    account: "$GOOGLE_TTS_ACCOUNT:"
    vertexai:
      enabled: true

koog:
#  anthropic: {}
#  google: {}
#  openrouter: {}
#  deepseek: {}
  openai:
    apikey: "$OPENAI_API_KEY:changeme"

timeout: {}

scripting:
  executionTimeoutSeconds: ${SCRIPTING_EXECUTION_TIMEOUT_SECONDS:600}

scheduler:
  enabled: ${SCHEDULER_ENABLED:true}
