org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
kotlin.apple.xcodeCompatibility.nowarn=true

android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

org.jetbrains.compose.experimental.wasm.enabled=true

# Shared build configuration accesses subprojects and requires project isolation to be disabled.
org.gradle.isolated-projects=false
org.gradle.configuration-cache.problems=warn

# Product defaults for the CLI's macOS signing and notarization tasks.
# Configure account-specific values in ~/.gradle/gradle.properties or environment variables.
bosca.macos.pkgIdentifier=io.bosca.cli
bosca.macos.notaryKeychainProfile=bosca-notary
