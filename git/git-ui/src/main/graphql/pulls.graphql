query GitUiPullList($status: GitPullRequestStatus, $offset: Long!) {
  git {
    allPullRequests(status: $status, offset: $offset, limit: 50) {
      id
      repositoryId
      number
      title
      description
      status
      sourceBranch
      targetBranch
      authorId
      created
      updated
    }
  }
}
query GitUiRepositoryPullList(
  $repo: UUID!
  $status: GitPullRequestStatus
  $offset: Long!
) {
  git {
    pullRequests(
      repositoryId: $repo
      status: $status
      offset: $offset
      limit: 50
    ) {
      id
      repositoryId
      number
      title
      description
      status
      sourceBranch
      targetBranch
      authorId
      created
      updated
    }
  }
}
query GitUiPull($id: UUID!, $mergeDetails: Boolean!) {
  git {
    pullRequest: pullRequestById(id: $id) {
      deleteBranchOnMerge
      id
      version
      repositoryId
      number
      title
      description
      status
      sourceBranch
      targetBranch
      authorId
      mergeable @include(if: $mergeDetails)
      failingStatusChecks @include(if: $mergeDetails)
      created
      updated
      sourceRepositoryId
      mergeStrategy
      mergedBy
      mergedAt
      mergeSha
      mergeBaseSha
      conflictingFiles @include(if: $mergeDetails)
      assignees {
        id
        name
        slug
      }
      dependencies {
        id
        repositoryId
        number
        title
        status
      }
      dependents {
        id
        repositoryId
        number
        title
        status
      }
      reviews {
        id
        reviewerId
        status
        body
        created
        dismissedAt
        dismissReason
        comments {
          id
          authorId
          content
          filePath
          oldLineNumber
          newLineNumber
          commitSha
          outdated
          resolved
          created
          updated
        }
      }
    }
  }
}
query GitUiPullHeads($repo: UUID!, $sourceRepo: UUID!, $source: String!, $target: String!) {
  git {
    sourceHead: commits(repositoryId: $sourceRepo, ref: $source, offset: 0, limit: 1) { sha }
    targetHead: commits(repositoryId: $repo, ref: $target, offset: 0, limit: 1) { sha }
  }
}
query GitUiMergePlan($id: UUID!) {
  git {
    pullRequestMergePlan(id: $id) {
      id
      version
      repositoryId
      number
      title
      status
      mergeable
      failingStatusChecks
    }
  }
}
mutation GitUiCreatePull($input: CreateGitPullRequestInput!) {
  git {
    createPullRequest(input: $input) {
      id
      repositoryId
      number
    }
  }
}
mutation GitUiMergePull($id: UUID!, $strategy: GitMergeStrategy!, $expectedVersion: Long!, $bypassStatusChecks: Boolean!) {
  git {
    mergePullRequest(id: $id, strategy: $strategy, expectedVersion: $expectedVersion, bypassStatusChecks: $bypassStatusChecks) {
      id
      status
    }
  }
}
mutation GitUiMergePullDependencies($id: UUID!, $strategy: GitMergeStrategy!, $expectedVersion: Long!, $bypassStatusChecks: Boolean!) {
  git {
    mergePullRequestWithDependencies(id: $id, strategy: $strategy, expectedVersion: $expectedVersion, bypassStatusChecks: $bypassStatusChecks) {
      id
      status
    }
  }
}
mutation GitUiClosePull($id: UUID!) {
  git {
    closePullRequest(id: $id) {
      id
      status
    }
  }
}
mutation GitUiReopenPull($id: UUID!) {
  git {
    reopenPullRequest(id: $id) {
      id
      status
    }
  }
}
mutation GitUiReadyPull($id: UUID!) {
  git {
    markPullRequestReady(id: $id) {
      id
      status
    }
  }
}
mutation GitUiReview($input: SubmitGitReviewInput!) {
  git {
    submitReview(input: $input) {
      id
    }
  }
}
mutation GitUiReviewComment($input: AddGitReviewCommentInput!) {
  git {
    addReviewComment(input: $input) {
      id
    }
  }
}
mutation GitUiResolveThread($id: UUID!, $file: String!, $line: Int!) {
  git {
    resolveReviewThread(pullRequestId: $id, filePath: $file, lineNumber: $line)
  }
}
mutation GitUiReplyComment($id: UUID!, $comment: UUID!, $content: String!, $version: Long!) {
  git {
    replyReviewComment(pullRequestId: $id, commentId: $comment, content: $content, expectedVersion: $version) {
      id
    }
  }
}
mutation GitUiAssignPull($id: UUID!, $profile: UUID!) {
  git {
    assignPullRequest(id: $id, profileId: $profile) {
      id
    }
  }
}
mutation GitUiUnassignPull($id: UUID!, $profile: UUID!) {
  git {
    unassignPullRequest(id: $id, profileId: $profile) {
      id
    }
  }
}
mutation GitUiAddPullDependency($id: UUID!, $dependency: UUID!) {
  git {
    addPullRequestDependency(id: $id, dependencyId: $dependency) {
      id
    }
  }
}
mutation GitUiRemovePullDependency($id: UUID!, $dependency: UUID!) {
  git {
    removePullRequestDependency(id: $id, dependencyId: $dependency) {
      id
    }
  }
}
query GitUiPullDiffPage($repo: UUID!, $number: Int!, $offset: Int!, $commitSha: String) {
  git {
    pullRequest(repositoryId: $repo, number: $number) {
      version
      diff(commitSha: $commitSha) {
        oldPath
        newPath
        changeType
        newLineCount
        hunks {
          oldStart
          oldCount
          newStart
          newCount
          totalLineCount
          lines(offset: $offset, limit: 2000) {
            content
            type
            oldLineNumber
            newLineNumber
          }
        }
      }
    }
  }
}

mutation GitUiUpdatePull($id: UUID!, $input: UpdateGitPullRequestInput!) {
  git {
    updatePullRequest(id: $id, input: $input) {
      id
      version
    }
  }
}

query GitUiPullCommits($id: UUID!, $offset: Long!) {
  git {
    pullRequestById(id: $id) {
      version
      commits(offset: $offset, limit: 26) {
        sha
        message
        authorName
        authorDate
        parentShas
      }
    }
  }
}
