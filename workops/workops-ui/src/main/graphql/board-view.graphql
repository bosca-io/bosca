fragment WorkOpsBoardCardFields on WorkOpsTask {
  id key summary version assigneeProfileId assignee { name }
  project { id }
  priority { name }
  status { id name category }
  transitions { id name toState { status { id category } } }
}
query WorkOpsBoardView($id: UUID!) {
  workOps {
    boards { board(id: $id) {
      id name type swimlaneStrategy projectId programId portfolioId projects { id }
      columns { id name displayOrder statusIds wipLimit }
    } }
    projects { all { id key name archivedAt program { id portfolio { id } } } }
    tasks { resolutions { id name } }
  }
}
query WorkOpsBoardCards($source: String!) {
  workOps { savedFilters { searchTasks(source: $source, offset: 0, limit: 200) { rows { ...WorkOpsBoardCardFields } } } }
}
query WorkOpsBoardTask($id: UUID!) {
  workOps { tasks { task(id: $id) { ...WorkOpsBoardCardFields } } }
}
query WorkOpsBoardViewSprints($boardId: UUID!, $offset: Long!) {
  workOps { sprints { byBoard(boardId: $boardId, offset: $offset, limit: 100) {
    id name state endDate committedTaskIds addedDuringSprintTaskIds
  } } }
}
mutation WorkOpsMoveBoardCard($id: UUID!, $transitionId: UUID!, $version: Long!, $resolutionId: UUID) {
  workOps { tasks { transition(id: $id, transitionId: $transitionId, expectedVersion: $version, resolutionId: $resolutionId) { ...WorkOpsBoardCardFields } } }
}
mutation WorkOpsQuickAddBoardTask($projectId: UUID!, $summary: String!, $sprintId: UUID) {
  workOps { tasks { create(input: { projectId: $projectId, summary: $summary, sprintId: $sprintId }) { ...WorkOpsBoardCardFields } } }
}
