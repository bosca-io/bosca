query WorkOpsSpecContexts($id: UUID!) {
  workOps { specs { spec(id: $id) { contexts { id contextType targetId label createdAt } } } }
}
query WorkOpsContextItems($query: String!, $filter: [String!]!, $offset: Int!) {
  search { search(query: { query: $query, filter: $filter, storageSystemName: "Admin Search Index", offset: $offset, limit: 26 }) {
    documents { metadata { id name } collection { id name } profile { id name } }
  } }
}
query WorkOpsContextTasks($source: String!, $offset: Long!) {
  workOps { savedFilters { searchTasks(source: $source, offset: $offset, limit: 26) { rows { id summary } } } }
}
query WorkOpsContextCollection($id: UUID!) {
  content { collections { collection(id: $id) { name } } }
}
query WorkOpsContextProject($id: UUID!) {
  workOps { projects { project(id: $id) { name } } }
}
mutation WorkOpsAddSpecContext($id: UUID!, $input: CreateWorkOpsSpecContextInput!) {
  workOps { specs { addContext(specId: $id, input: $input) { id } } }
}
mutation WorkOpsRemoveSpecContext($id: UUID!, $contextId: UUID!) {
  workOps { specs { removeContext(specId: $id, contextId: $contextId) } }
}
