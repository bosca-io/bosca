query WorkOpsDocumentMetadataChoices($query: String!, $filters: [String!]!) {
  search { search(query: { query: $query, filter: $filters, storageSystemName: "Admin Search Index", offset: 0, limit: 20 }) {
    documents { metadata { id name content { type } } }
  } }
}

query WorkOpsDocumentMetadataReference($id: UUID!, $version: Int) {
  content { metadata(id: $id, version: $version) { id name content { type } } }
}

query WorkOpsDocumentBibleChoices {
  content { findMetadata(query: { contentTypes: ["bosca/v-bible"] }) {
    id name bible { name }
  } }
}

query WorkOpsDocumentScriptureChoices($id: UUID!, $query: String!) {
  content { metadata(id: $id) { bible { find(human: $query) {
    reference { human usfm }
    chapter { reference { human usfm } verses { human usfm } }
  } } } }
}

query WorkOpsDocumentScripturePassage($id: UUID!, $chapter: String!, $book: String!) {
  content { metadata(id: $id) { bible {
    name styles
    book(usfm: $book) { nameLong }
    chapter(usfm: $chapter) { component attribution { copyright citation informationUrl } }
  } } }
}
