name: Bosca Tag Image Release
# Publish bosca/<image>:<tag> to Bosca Artifacts and mirror it to GHCR.
# Each producer declares its own artifact: coordinates resolve before matrix expansion.
on:
  tag:
    patterns: ["*"]

concurrency:
  group: tag-image-release
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Xmx4g -XX:+UseG1GC"

jobs:
  publish-server: &image-release-job
    runner: linux
    timeout: 120m
    matrix:
      image: [bosca-server]
    secrets: [GITHUB_USERNAME, GITHUB_TOKEN]
    artifacts:
      - type: docker
        namespace: bosca
        coordinate: "bosca-server:${{ version }}"
    steps:
      - name: Checkout
        uses: checkout
      - name: Setup Registry
        uses: setup-registry
        with:
          repository: bosca-maven
      - name: Setup Java
        uses: setup-java
        with:
          distribution: graal
          stream: 25i1
          version: "25.0.3"
      - name: Setup Rust
        uses: setup-rust
        with:
          toolchain: stable
      - name: Setup Node
        uses: setup-node
        with:
          version: "22"
      - name: Setup pnpm
        uses: setup-pnpm
        with:
          version: "10"
      - name: Log in to the GitHub Container Registry
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_USERNAME" --password-stdin
        env:
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: scripts/release/build-image.sh "$IMAGE" "$VERSION"
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ version }}
          BOSCA_IMAGE_MIRROR_REGISTRY: ghcr.io/bosca-io/bosca
      - name: Log out of the GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  publish-runner:
    <<: *image-release-job
    matrix:
      image: [bosca-runner]
    artifacts:
      - type: docker
        namespace: bosca
        coordinate: "bosca-runner:${{ version }}"

  publish-studio:
    <<: *image-release-job
    matrix:
      image: [bosca-studio]
    artifacts:
      - type: docker
        namespace: bosca
        coordinate: "bosca-studio:${{ version }}"

  publish-git:
    <<: *image-release-job
    matrix:
      image: [git-server]
    artifacts:
      - type: docker
        namespace: bosca
        coordinate: "git-server:${{ version }}"

  publish-artifacts:
    <<: *image-release-job
    matrix:
      image: [artifacts-server]
    artifacts:
      - type: docker
        namespace: bosca
        coordinate: "artifacts-server:${{ version }}"

  notify:
    runner: linux
    timeout: 5m
    needs: [publish-server, publish-runner, publish-studio, publish-git, publish-artifacts]
    if: always()
    steps:
      - name: Notify Success
        uses: notify
        if: needs.publish-server.result == 'success' && needs.publish-runner.result == 'success' && needs.publish-studio.result == 'success' && needs.publish-git.result == 'success' && needs.publish-artifacts.result == 'success'
        with:
          channel: slack
          message: "Platform images bosca/*:${{ version }} published to Bosca Artifacts and GHCR"
      - name: Notify Failure
        uses: notify
        if: needs.publish-server.result != 'success' || needs.publish-runner.result != 'success' || needs.publish-studio.result != 'success' || needs.publish-git.result != 'success' || needs.publish-artifacts.result != 'success'
        with:
          channel: slack
          message: "Platform image release ${{ version }} FAILED — check pipeline logs"
