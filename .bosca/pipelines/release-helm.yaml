name: "Release: Helm Charts"
on:
  manual: true
  release: true

concurrency:
  group: workspace-helm-release
  cancel-in-progress: false

jobs:
  publish-charts:
    runner: linux
    timeout: 150m
    steps:
      - name: Validate release tag
        run: |
          case "$RELEASE_REF" in
            refs/tags/?*) ;;
            *) echo "Select an existing Git tag for this chart release." >&2; exit 1 ;;
          esac
        env:
          RELEASE_REF: ${{ ref }}
      - name: Checkout
        uses: checkout
      - name: Setup Registry
        uses: setup-registry
        with:
          repository: bosca-maven
      - name: Setup Node
        uses: setup-node
        with:
          version: "22"
      - name: Setup Helm
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "Unsupported Helm architecture" >&2; exit 1 ;;
          esac
          tools_dir=$(mktemp -d)
          archive="helm-${HELM_VERSION}-linux-${arch}.tar.gz"
          curl -fsSL "https://get.helm.sh/$archive" -o "$tools_dir/$archive"
          curl -fsSL "https://get.helm.sh/$archive.sha256sum" -o "$tools_dir/$archive.sha256sum"
          (cd "$tools_dir" && sha256sum -c "$archive.sha256sum")
          tar -xzf "$tools_dir/$archive" -C "$tools_dir"
          echo "$tools_dir/linux-$arch" >> "$BOSCA_PATH"
        env:
          HELM_VERSION: v3.22.0
      - name: Setup Helm release tooling
        run: |
          set -euo pipefail
          test_env=$(mktemp -d)
          python3 -m venv "$test_env"
          "$test_env/bin/pip" install -r helm/tests/requirements.txt
          echo "$test_env/bin" >> "$BOSCA_PATH"
      - name: Test release script
        run: bash helm/scripts/release-test.sh
      - name: Test release versions
        run: python3 helm/tests/test_release_versions.py
      - name: Test Kit image defaults
        run: node --test helm/scripts/kit-images.test.mjs
      - name: Test Git gateway routing
        run: python3 helm/tests/test_git_routes.py
      - name: Resolve released Kit runtime metadata
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 7200))
          while true; do
            status=0
            node helm/scripts/kit-images.mjs "${RELEASE_REF#refs/tags/}" .kit-images.json || status=$?
            (( status == 0 )) && break
            # Only an unpublished image (exit 75) is worth waiting for; any other failure is permanent.
            if (( status != 75 )); then
              echo "Kit runtime metadata could not be resolved for this release." >&2
              exit "$status"
            fi
            if (( SECONDS >= deadline )); then
              echo "Kit runtime images are not available for this release; check their image release jobs." >&2
              exit 1
            fi
            echo "Waiting for this release's qualified Kit runtime images."
            sleep 30
          done
        env:
          RELEASE_REF: ${{ ref }}
      - name: Package charts
        run: bash helm/scripts/release.sh package --version "${RELEASE_REF#refs/tags/}" --kit-images .kit-images.json --output .helm-release-packages
        env:
          RELEASE_REF: ${{ ref }}
      - name: Publish and verify both destinations
        run: |
          export HELM_REPO_URL="${BOSCA_REGISTRY_URL%/}/helm/bosca-charts"
          registry_host="${BOSCA_REGISTRY_URL#http://}"
          registry_host="${registry_host#https://}"
          registry_host="${registry_host%%/*}"
          export HELM_OCI_URL="oci://$registry_host/bosca-charts"
          export HELM_OCI_USERNAME=api_token
          export HELM_OCI_TOKEN="$BOSCA_REGISTRY_TOKEN"
          bash helm/scripts/release.sh publish --output .helm-release-packages
