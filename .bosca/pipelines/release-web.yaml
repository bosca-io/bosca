name: "Release: Web Packages"
on:
  tag:
    patterns: ["*"]

concurrency:
  group: workspace-web-release
  cancel-in-progress: false

jobs:
  publish-web:
    runner: linux
    timeout: 15m
    steps:
      - name: Checkout
        uses: checkout
      - name: Setup Registry
        uses: setup-registry
        with:
          repository: bosca-maven
      - name: Setup Node
        uses: setup-node
        with:
          version: "22"
      - name: Setup pnpm
        uses: setup-pnpm
        with:
          version: "10"
      - name: Cache pnpm
        uses: cache
        with:
          key: pnpm-release-${{ hashFiles('web/pnpm-lock.yaml') }}
          paths: '["~/.pnpm-store"]'
          restore-keys: '["pnpm-release-"]'
      - name: Extract Version
        run: |
          echo "RELEASE_VERSION=${PUBLISH_VERSION}" >> "$BOSCA_ENV"
        env:
          PUBLISH_VERSION: ${{ version }}
      - name: Install Dependencies
        run: cd web && pnpm install --frozen-lockfile
      - name: Set Package Versions
        run: |
          cd web
          for pkg in packages/*/package.json; do
            dir=$(dirname "$pkg")
            (cd "$dir" && pnpm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version)
          done
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
      - name: Build Packages
        run: cd web && pnpm --filter './packages/*' build
      - name: Install Test Browser
        run: cd web && pnpm --filter @bosca/auth-client-browser exec playwright install --with-deps chromium
      - name: Run Web Tests
        run: cd web && pnpm --filter './packages/*' run test:ci
      - name: Publish Packages
        # Publishes to the npm registry of the Artifacts server configured by Setup Registry.
        run: |
          registry="${BOSCA_REGISTRY_URL%/}/npm/"
          npm config set "//${registry#*://}:_authToken" "$BOSCA_REGISTRY_TOKEN"
          cd web && pnpm --filter './packages/*' publish --no-git-checks --registry "$registry"

  publish-bml-runtime:
    runner: linux
    timeout: 15m
    artifacts:
      - type: npm
        namespace: "@bosca"
        coordinate: "bml:${{ version }}"
    steps:
      - name: Checkout
        uses: checkout
      - name: Setup Registry
        uses: setup-registry
        with:
          repository: bosca-maven
      - name: Setup Node
        uses: setup-node
        with:
          version: "22"
      - name: Install BML Runtime Dependencies
        working-directory: bml/bml-runtime
        run: npm ci --no-audit --no-fund
      - name: Set BML Runtime Version
        working-directory: bml/bml-runtime
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
        env:
          RELEASE_VERSION: ${{ version }}
      - name: Test BML Runtime
        working-directory: bml/bml-runtime
        run: npm test
      - name: Build BML Runtime
        working-directory: bml/bml-runtime
        run: npm run build
      - name: Publish BML Runtime
        working-directory: bml/bml-runtime
        run: |
          registry="${BOSCA_REGISTRY_URL%/}/npm/"
          npm config set "//${registry#*://}:_authToken" "$BOSCA_REGISTRY_TOKEN"
          npm publish --registry "$registry"

  notify:
    runner: linux
    timeout: 5m
    needs: [publish-web, publish-bml-runtime]
    if: always()
    steps:
      - name: Notify Success
        uses: notify
        if: needs.publish-web.result == 'success' && needs.publish-bml-runtime.result == 'success'
        with:
          channel: slack
          message: "Web ${{ ref }} published successfully — web packages and BML browser runtime deployed"
      - name: Notify Failure
        uses: notify
        if: needs.publish-web.result != 'success' || needs.publish-bml-runtime.result != 'success'
        with:
          channel: slack
          message: "Web ${{ ref }} release FAILED — check pipeline logs"
