name: "CI"
on:
  push:
    branches: ["**"]
  manual: true

concurrency:
  group: workspace-ci-${{ branch }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Xmx4g -XX:+UseG1GC"

jobs:
  test-jvm:
    runner: macos
    timeout: 45m
    steps:
      - name: Checkout
        uses: checkout
      - name: Setup Registry
        uses: setup-registry
        with:
          repository: bosca-maven
      - name: Setup Java
        uses: setup-java
        with:
          version: "25"
          distribution: zulu
      - name: Setup Node
        # The BML sites bundle their client scripts with
        # node/esbuild during processResources, which `test` reaches via classes.
        uses: setup-node
        with:
          version: "22"
      - name: Setup Rust
        # The root test task configures firebase-scrypt, whose Gradle project
        # invokes Cargo to compile the UniFFI native library.
        uses: setup-rust
        with:
          toolchain: stable
      - name: Configure npm Registry
        run: |
          registry="${BOSCA_REGISTRY_URL:?setup-registry must configure Bosca Artifacts before npm}"
          registry="${registry%/}"
          case "$registry" in
            http://*|https://*) ;;
            *) registry="https://$registry" ;;
          esac
          npm config set @bosca:registry "$registry/npm/" --location=user
      - name: Start Shared Test Resources
        run: ./gradlew --no-daemon -Pbosca.ios.enabled=false testResourcesUp
      - name: Install BML Bundler Dependencies
        # The BML client bundlers do a bare `import "esbuild"` resolved from the
        # bml-runtime checkout's node_modules, which is git-ignored — without
        # this, the client bundle tasks fail with ERR_MODULE_NOT_FOUND.
        run: cd bml/bml-runtime && npm ci --no-audit --no-fund
      - name: Install BML Test Browser
        working-directory: bml/bml-design-catalog
        run: |
          npm ci --no-audit --no-fund
          node node_modules/playwright-core/cli.js install --no-shell chromium
          bml_chrome="$(node -p 'require("playwright-core").chromium.executablePath()')"
          test -x "$bml_chrome"
          "$bml_chrome" --version
          printf 'BML_DESIGN_CHROME_BINARY=%q\n' "$bml_chrome" >> "$BOSCA_ENV"
      - name: Run BML Browser Tests
        run: ./gradlew --no-daemon -Pbosca.ios.enabled=false testBmlBrowser
      - name: Run JVM Tests
        run: >-
          ./gradlew --no-daemon -Pbosca.ios.enabled=false --max-workers=4 test
          -x :bml:bml-server:chunkCacheBrowserTest
          -x :notifications-web:test
          -x :bml:examples:design-library:test
          -x :bml:bml-design-catalog:test
      - name: Stop Shared Test Resources
        run: ./gradlew --no-daemon -Pbosca.ios.enabled=false testResourcesDown
        if: always()
