name: Bosca Release
on:
  tag:
    patterns: ["*"]

concurrency:
  group: workspace-release
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Xmx4g -XX:+UseG1GC"

jobs:
  test-jvm:
    runner: macos
#    runner: linux
    timeout: 45m
    steps:
      - name: Checkout
        uses: checkout
      - name: Setup Registry
        uses: setup-registry
        with:
          repository: bosca-maven
      - name: Setup Java
        uses: setup-java
        with:
          version: "25"
          distribution: zulu
      - name: Setup Node
        # The BML sites bundle their client scripts with
        # node/esbuild during processResources, which `test` reaches via classes.
        uses: setup-node
        with:
          version: "22"
      - name: Setup Rust
        # The root test task configures firebase-scrypt, whose Gradle project
        # invokes Cargo to compile the UniFFI native library.
        uses: setup-rust
        with:
          toolchain: stable
      - name: Start Shared Test Resources
        run: ./gradlew --no-daemon testResourcesUp
      - name: Install BML Bundler Dependencies
        # The BML client bundlers do a bare `import "esbuild"` resolved from the
        # bml-runtime checkout's node_modules, which is git-ignored — without
        # this, the client bundle tasks fail with ERR_MODULE_NOT_FOUND.
        run: cd bml/bml-runtime && npm ci --no-audit --no-fund
      - name: Run JVM Tests
        run: ./gradlew --no-daemon test
      - name: Stop Shared Test Resources
        run: ./gradlew --no-daemon testResourcesDown
        if: always()

  publish-jvm:
    runner: macos
#    runner: linux
    timeout: 45m
    steps:
      - name: Checkout
        uses: checkout
      - name: Setup Registry
        uses: setup-registry
        with:
          repository: bosca-maven
      - name: Setup Java
        uses: setup-java
        with:
          version: "25"
          distribution: zulu
      - name: Setup Rust
        # Publication dependency resolution configures firebase-scrypt even
        # when its publication tasks are excluded.
        uses: setup-rust
        with:
          toolchain: stable
      - name: Extract Version
        run: |
          RELEASE_VERSION="${PUBLISH_VERSION#refs/tags/}"
          echo "PUBLISH_VERSION=${RELEASE_VERSION}" >> "$BOSCA_ENV"
        env:
          PUBLISH_VERSION: ${{ ref }}
      - name: Publish BML Gradle Plugins
        run: ./gradlew --no-daemon :bml:bml-gradle:publish
      - name: Publish GraphQL Gradle Plugins
        run: ./gradlew --no-daemon :bosca-graphql:bosca-graphql-gradle:publish
      - name: Publish JVM Modules Except Firebase Scrypt
        run: ./gradlew --no-daemon publishExceptFirebaseScrypt

  publish-firebase-scrypt:
    runner: linux
    timeout: 15m
    steps:
      - name: Checkout
        uses: checkout
      - name: Setup Registry
        uses: setup-registry
        with:
          repository: bosca-maven
      - name: Setup Java
        uses: setup-java
        with:
          version: "25"
          distribution: zulu
      - name: Setup Rust
        uses: setup-rust
        with:
          toolchain: stable
      - name: Extract Version
        run: |
          RELEASE_VERSION="${PUBLISH_VERSION#refs/tags/}"
          echo "PUBLISH_VERSION=${RELEASE_VERSION}" >> "$BOSCA_ENV"
        env:
          PUBLISH_VERSION: ${{ ref }}
      - name: Publish Firebase Scrypt
        run: ./gradlew --no-daemon :firebase-scrypt:firebase-scrypt:publish

  update-versions:
    runner: macos
#    runner: linux
    timeout: 15m
    needs:
      - publish-jvm
      - publish-firebase-scrypt
      - test-jvm
    artifacts:
      - type: maven
        namespace: bosca-maven
        coordinate: "io.bosca:core:${{ version }}"
    steps:
      - name: Checkout
        uses: checkout
      - name: Setup Registry
        uses: setup-registry
        with:
          repository: bosca-maven
      - name: Setup Java
        uses: setup-java
        with:
          version: "25"
          distribution: zulu
      - name: Setup Node
        # updateBoscaVersions also re-resolves the @bosca/* npm dependencies of the
        # npm-managed apps (such as notifications-web) against the Bosca npm registry, so it
        # needs npm on the runner. setup-registry supplies credentials; each
        # app's .npmrc selects the registry for @bosca packages.
        uses: setup-node
        with:
          version: "22"
      - name: Extract Version
        run: |
          RELEASE_VERSION="${PUBLISH_VERSION#refs/tags/}"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$BOSCA_ENV"
        env:
          PUBLISH_VERSION: ${{ ref }}
      - name: Update Version Catalogs
        run: ./gradlew --no-daemon updateBoscaVersions
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
      - name: Commit Version Updates
        uses: git-update-workspace-refs
        with:
          message: "Release ${{ env.RELEASE_VERSION }} — update dependency versions"
      - name: Push Workspace
        uses: git-push

  notify:
    runner: macos
#    runner: linux
    timeout: 5m
    needs: [update-versions]
    if: always()
    steps:
      - name: Notify Success
        uses: notify
        if: needs.update-versions.result == 'success'
        with:
          channel: slack
          message: "Release ${{ ref }} published successfully — all JVM packages deployed, version catalogs updated"
      - name: Notify Failure
        uses: notify
        if: needs.update-versions.result == 'failure'
        with:
          channel: slack
          message: "Release ${{ ref }} FAILED — check pipeline logs"
