# Author-and-go publish: every push to main rebuilds the compiled message
# jar and publishes it to the raw artifacts registry as
#   (type=raw, namespace=bml-message, coordinate=bosca-messages:<version>).
# Creating the version makes the registry announce it on `bosca.artifacts.version.published`,
# which bml-message-server subscribes to for hot reload — no deploy, no restart.
#
# The version is minted per publish (push-triggered, no tags): a UTC-timestamp prefix keeps
# versions lexicographically monotonic for latest-version resolution, and the short commit
# SHA ties each artifact back to its commit. Because the version is computed in-step, the
# declarative `artifacts:` block (resolved at run creation) can't express it — the publish
# step verifies the upload itself instead.
name: Publish Message Templates

on:
  push:
    branches: [main]
    paths:
      - "apps/bosca-messages/**"
      - ".bosca/pipelines/apps-bosca-messages-publish.yaml"
  manual: true

concurrency:
  group: publish-messages
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Xmx4g -XX:+UseG1GC"

jobs:
  publish:
    runner: linux
    timeout: 30m
    steps:
      - name: Checkout
        uses: checkout

      - name: Setup Java
        working-directory: apps/bosca-messages
        uses: setup-java
        with:
          version: "25"
          distribution: zulu

      - name: Setup Registry
        working-directory: apps/bosca-messages
        # Configures boscaRegistry* so Gradle can resolve io.bosca:* dependencies, and
        # exports BOSCA_REGISTRY_URL / BOSCA_REGISTRY_TOKEN for the raw publish below
        # (the agent token needs raw push permission on the bml-message namespace; the
        # namespace and repository auto-create on first push).
        uses: setup-registry
        with:
          repository: bosca-maven

      - name: Resolve version
        working-directory: apps/bosca-messages
        # Builtins like COMMIT_SHA exist only in ${{ }} interpolation, not the shell process
        # env — bridge it through the step env so the bash substring below has a value.
        run: |
          echo "RELEASE_VERSION=$(date -u +%Y%m%d%H%M%S)-${COMMIT_SHA:0:8}" >> "$BOSCA_ENV"
        env:
          COMMIT_SHA: ${{ env.COMMIT_SHA }}

      - name: Build and test
        working-directory: apps/bosca-messages
        run: cd ../../ && ./gradlew --no-daemon :bosca-messages:build

      - name: Publish message jar
        working-directory: apps/bosca-messages
        # The agent-side registry-upload action PUTs to the agent's configured registry with
        # the agent token (raw push on the bml-message namespace; namespace and repository
        # auto-create on first push). Creating the version makes the registry announce
        # `bosca.artifacts.version.published`, which the message server hot-reloads on.
        uses: registry-upload
        with:
          namespace: bml-message
          name: bosca-messages
          version: ${{ env.RELEASE_VERSION }}
          files:
            - build/libs/bosca-messages.jar
