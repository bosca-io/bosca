# Profile name. The controller creates a private Service and Pod for each model version.
fullnameOverride: "tf-serving"
nameOverride: ""

image:
  repository: tensorflow/serving
  tag: ""             # defaults to the chart's TensorFlow Serving appVersion
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
securityContext: {}

service:
  port: 8501          # version-specific REST Service
  grpcPort: 8500      # serving container's gRPC listener

# Allow ten minutes for model initialization before restarting an unhealthy container.
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  failureThreshold: 30

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

modelBasePath: /models

# The only serving mode. Disabled renders no resources; enabled installs a
# ServingModelProfile for the controller. There is no always-on Deployment.
provisioning:
  enabled: false
  serviceNamePrefix: tf-serving-model-
  maxCandidates: 1
  drainSeconds: 120
  failureGraceSeconds: 600
  startupTimeoutSeconds: 1800

# The controller supplies exact artifact names and versions to this download init container.
loader:
  image:
    registry: ghcr.io/bosca-io/bosca
    repository: recommendation-model-loader
    # Select the published Bosca ML release matching the controller/server/runner.
    tag: "5.12.15"
    pullPolicy: IfNotPresent
  artifactsUrl: "http://bosca-bosca-artifacts-server:8084"
  artifactsNamespace: "model"
  boscaUrl: "http://bosca-bosca-server:8080"
  secrets:
    # Write-authorized credential used by the controller for preparation/failure reports.
    boscaToken:
      name: recommendation-ml
      key: bosca_token
    # Read-only credential for discovery and artifact downloads.
    artifactsToken:
      enabled: true
      name: recommendation-ml
      key: artifacts_pull_token
  extraEnv: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Resources for each model's serving container; each Pod has its own emptyDir storage.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

extraEnv: {}
envFromConfigMaps:
  - otel-env
imagePullSecrets:
  - name: docker-registry
nodeSelector: {}
tolerations: []
affinity: {}

global:
  imageRegistry: ""
  domain: ""
