{{- /*
The public asset and email-engagement surface of the message server, on messages.<domain>:
version-pinned bundle assets plus the first-party engagement tracking routes. The render
API (/render) and status/health (/status, /api/v1/*) are cluster-internal by design —
do NOT add matches for them here.
*/}}
{{- if and .Values.gateway.enabled .Values.gateway.hostnames }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "messages-%s" (.Values.global.domain | replace "." "-") | quote }}
  labels:
    {{- include "bosca-common.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.gatewayName }}
      {{- with .Values.gateway.gatewayNamespace }}
      namespace: {{ . }}
      {{- end }}
      port: 443
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        # Bundle assets referenced by delivered emails (immutable, version-pinned).
        - path:
            type: PathPrefix
            value: /assets
        # Click redirect (302 to the original URL).
        - path:
            type: PathPrefix
            value: /c
        # Open pixel.
        - path:
            type: PathPrefix
            value: /o
      backendRefs:
        - name: {{ include "bosca-common.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
