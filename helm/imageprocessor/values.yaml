# Pin the Service/Deployment to the bare name `imageprocessor` (no release
# prefix). bosca-server and bosca-runner reach this service via the hardcoded
# DNS `http://imageprocessor.<namespace>.svc.cluster.local:8003`, so renaming
# would break them. Do not override.
fullnameOverride: "imageprocessor"
nameOverride: ""

replicaCount: 1

# Rolling update strategy. `maxUnavailable: 0` guarantees no capacity dip
# during rollouts. Bump `maxSurge` higher for faster, more aggressive
# rollouts at the cost of brief extra pod-hours during the rollout window.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0

image:
  registry: ghcr.io/bosca-io/bosca
  repository: imageprocessor
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

commonAnnotations: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8003

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Comma-separated list of URL prefixes the service will fetch images from.
# Scheme, hostname and port must match; any path prefix is also enforced.
# Redirect destinations must pass the same check. Requests outside the
# allowed prefixes are rejected with 401. Required —
# the service is otherwise unusable. Example:
#   extraEnv:
#     SUPPORTED_URLS: "https://example.com,https://artifacts.example.com"
extraEnv: {}

envFromConfigMaps:
  - otel-env

imagePullSecrets:
  - name: docker-registry

nodeSelector: {}
tolerations: []
affinity: {}

global:
  # Registry (and path) for every Bosca image; when set, it overrides image.registry.
  imageRegistry: ""
  domain: ""
