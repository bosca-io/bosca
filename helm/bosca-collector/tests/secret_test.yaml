suite: bosca-collector secret rendering
templates:
  - templates/secret.yaml
values:
  - ../values.yaml
release:
  name: test
  namespace: bosca
tests:
  - it: renders all 5 secrets when defaults applied (all create:true)
    asserts:
      - hasDocuments:
          count: 5

  - it: database Secret has username + password
    documentSelector:
      path: metadata.name
      value: pg-creds-bosca-server
    asserts:
      - exists:
          path: stringData.username
      - exists:
          path: stringData.password

  - it: iceberg Secret uses pg-creds-bosca-warehouse
    documentSelector:
      path: metadata.name
      value: pg-creds-bosca-warehouse
    asserts:
      - isKind:
          of: Secret
      - exists:
          path: stringData.username
      - exists:
          path: stringData.password

  - it: setting nats.create=false removes nats Secret
    set:
      secrets.nats.create: false
    asserts:
      - hasDocuments:
          count: 4

  - it: setting all shared secrets create=false leaves only db + iceberg
    set:
      secrets.nats.create: false
      secrets.jwt.create: false
      secrets.s3.create: false
    asserts:
      - hasDocuments:
          count: 2

  - it: applied database values flow into stringData
    set:
      secrets.database.username: bosca-server
      secrets.database.password: hunter2
    documentSelector:
      path: metadata.name
      value: pg-creds-bosca-server
    asserts:
      - equal:
          path: stringData.username
          value: bosca-server
      - equal:
          path: stringData.password
          value: hunter2
