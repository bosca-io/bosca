suite: bosca-runner secret rendering
templates:
  - templates/secret.yaml
values:
  - ../values.yaml
release:
  name: test
  namespace: bosca
tests:
  - it: renders 14 secrets when all create:true defaults
    asserts:
      - hasDocuments:
          count: 14

  - it: database Secret renders with pg-creds-bosca-runner name
    documentSelector:
      path: metadata.name
      value: pg-creds-bosca-runner
    asserts:
      - exists:
          path: stringData.username
      - exists:
          path: stringData.password

  - it: scrypt Secret carries all four parameters
    documentSelector:
      path: metadata.name
      value: scrypt-key
    asserts:
      - exists:
          path: stringData.key
      - exists:
          path: stringData.salt
      - exists:
          path: stringData.mem_cost
      - exists:
          path: stringData.rounds

  - it: disabling all shared secrets leaves only database
    set:
      secrets.nats.create: false
      secrets.jwt.create: false
      secrets.url.create: false
      secrets.cfg.create: false
      secrets.meilisearch.create: false
      secrets.s3.create: false
      secrets.openai.create: false
      secrets.hubspot.create: false
      secrets.gemini.create: false
      secrets.google.create: false
      secrets.googleAccount.create: false
      secrets.facebook.create: false
      secrets.scrypt.create: false
    asserts:
      - hasDocuments:
          count: 1
