{{- range $name, $worker := .Values.workers }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bosca-common.fullname" $ }}-{{ $name }}
  labels:
    {{- include "bosca-common.labels" $ | nindent 4 }}
    app.kubernetes.io/component: runner-{{ $name }}
spec:
  # serviceName references a headless Service of the same name (in service.yaml).
  # podManagementPolicy: Parallel lets workers come up concurrently rather than
  # the default OrderedReady, since they don't depend on each other's startup.
  serviceName: {{ include "bosca-common.fullname" $ }}-{{ $name }}
  podManagementPolicy: Parallel
  replicas: {{ $worker.replicas }}
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit | default 1 }}
  selector:
    matchLabels:
      {{- include "bosca-common.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: runner-{{ $name }}
  template:
    metadata:
      labels:
        {{- include "bosca-common.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: runner-{{ $name }}
      annotations:
        checksum/appconfig: {{ include (print $.Template.BasePath "/configmap-appconfig.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ include "bosca-common.serviceAccountName" $ }}
      terminationGracePeriodSeconds: {{ default 300 $worker.terminationGracePeriodSeconds }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "bosca-common.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: runner
          image: {{ include "bosca-common.boscaImage" (dict "image" (merge (dict "tag" (default $.Chart.AppVersion $.Values.image.tag)) $.Values.image) "global" $.Values.global) }}
          imagePullPolicy: {{ include "bosca-common.imagePullPolicy" $.Values.image }}
          args: ["-config=/app/config/application.yaml"]
          securityContext:
            {{- include "bosca-common.securityContext" $ | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: {{ $.Values.managementPort }}
              protocol: TCP
          envFrom:
            {{- range $.Values.envFromConfigMaps }}
            - configMapRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0"
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: K8S_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            {{- with $.Values.appConfig.bmlMessageServerUrl }}
            - name: BML_MESSAGE_SERVER_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.appConfig.welcomeEmailUrl }}
            - name: WELCOME_EMAIL_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.secrets.database.secretName }}
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.database.usernameKey }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.database.passwordKey }}
            {{- end }}
            {{- with $.Values.secrets.nats.secretName }}
            - name: NATS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.nats.key }}
            {{- end }}
            {{- with $.Values.secrets.jwt.secretName }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.jwt.key }}
            {{- end }}
            {{- with $.Values.secrets.cfg.secretName }}
            - name: SECURITY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.cfg.key }}
            {{- end }}
            {{- with $.Values.secrets.meilisearch.secretName }}
            - name: MEILISEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.meilisearch.key }}
            {{- end }}
            {{- with $.Values.secrets.s3.secretName }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.s3.accessKeyIdKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.s3.secretAccessKeyKey }}
            {{- end }}
            {{- with $.Values.secrets.iceberg.secretName }}
            - name: ICEBERG_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.iceberg.usernameKey }}
            - name: ICEBERG_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.iceberg.passwordKey }}
            {{- end }}
            {{- with $.Values.secrets.icebergS3.secretName }}
            - name: ICEBERG_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.icebergS3.accessKeyIdKey }}
            - name: ICEBERG_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.icebergS3.secretAccessKeyKey }}
            {{- end }}
            {{- with $.Values.secrets.url.secretName }}
            - name: URL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.url.key }}
            {{- end }}
            {{- with $.Values.secrets.openai.secretName }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.openai.key }}
            {{- end }}
            {{- with $.Values.secrets.hubspot.secretName }}
            - name: HUBSPOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.hubspot.key }}
            {{- end }}
            {{- with $.Values.secrets.scrypt.secretName }}
            - name: SCRYPT_SIGNER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.scrypt.keyKey }}
            - name: SCRYPT_SALT_SEPARATOR
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.scrypt.saltKey }}
            - name: SCRYPT_MEM_COST
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.scrypt.memCostKey }}
            - name: SCRYPT_ROUNDS
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.scrypt.roundsKey }}
            {{- end }}
            {{- with $.Values.secrets.google.secretName }}
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.google.clientIdKey }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.google.clientSecretKey }}
            {{- end }}
            {{- with $.Values.secrets.googleAccount.secretName }}
            - name: GOOGLE_TTS_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.googleAccount.key }}
            {{- end }}
            {{- with $.Values.secrets.googleAccount.secretName }}
            - name: GOOGLE_GENAI_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.googleAccount.key }}
            {{- end }}
            {{- with $.Values.secrets.gemini.secretName }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.gemini.key }}
            {{- end }}
            {{- with $.Values.secrets.facebook.secretName }}
            - name: FACEBOOK_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.facebook.appIdKey }}
            - name: FACEBOOK_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.facebook.appSecretKey }}
            {{- end }}
          volumeMounts:
            - name: app-config
              mountPath: /app/config
              readOnly: true
          # The runner serves the same health endpoints as the server once module() returns and
          # NettyServerEngine binds the port. Boot runs migrations and installs seed packages,
          # which can take minutes on a fresh database, so a generous startupProbe gates liveness
          # and readiness until the HTTP server is actually up (the port only binds after boot
          # completes). Liveness then hits the cheap /api/v1/live endpoint (no DB) and is kept
          # tolerant so a load spike or slow database can't trigger a restart storm.
          # NOTE: /api/v1/live exists only in images rebuilt from this workspace's bosca-core,
          # AND requires the module() fix that lets the runner reach NettyServerEngine.start().
          startupProbe:
            httpGet:
              path: /api/v1/live
              port: management
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/live
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
      volumes:
        - name: app-config
          configMap:
            name: {{ include "bosca-common.fullname" $ }}-config
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
