apiVersion: v1
kind: Service
metadata:
  name: {{ include "bosca-common.fullname" . }}
  labels:
    {{- include "bosca-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.ui.port }}
      targetPort: ui
      protocol: TCP
      name: ui
  selector:
    {{- include "bosca-common.selectorLabels" . | nindent 4 }}
