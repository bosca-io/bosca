{{- if and .Values.gateway.enabled .Values.gateway.hostnames }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "git-%s" (.Values.global.domain | replace "." "-") | quote }}
  labels:
    {{- include "bosca-common.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.gatewayName }}
      {{- with .Values.gateway.gatewayNamespace }}
      namespace: {{ . }}
      {{- end }}
      port: 443
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- /* Gateway API allows at most eight matches per HTTPRoute rule. */}}
    {{- range chunk 8 (include "bosca-git-server.uiRoutes" . | fromYamlArray) }}
    - matches:
        {{- range . }}
        - path:
            type: RegularExpression
            value: {{ . | quote }}
        {{- end }}
      backendRefs:
        - name: {{ include "bosca-common.fullname" $ }}
          port: {{ $.Values.ui.port }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "bosca-common.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
