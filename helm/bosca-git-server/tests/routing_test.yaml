suite: Git backend and UI redirects
templates:
  - templates/service.yaml
  - templates/httproute.yaml
set:
  global.domain: example.com
  gateway.hostnames: [git.example.com]
release:
  name: test
tests:
  - it: keeps Git API on the Git host and redirects UI to Atlas
    template: templates/httproute.yaml
    asserts:
      - equal:
          path: spec.hostnames
          value: [git.example.com]
      - equal:
          path: spec.rules[0].matches[0].path.type
          value: RegularExpression
      - equal:
          path: spec.rules[0].filters[0].requestRedirect
          value: {scheme: https, hostname: atlas.example.com, statusCode: 302}
      - equal:
          path: spec.rules[1].filters[0].requestRedirect
          value: {scheme: https, hostname: atlas.example.com, statusCode: 302}
      - lengthEqual:
          path: spec.rules[0].matches
          count: 8
      - lengthEqual:
          path: spec.rules[1].matches
          count: 7
      - equal:
          path: spec.rules[2].matches[0].path
          value: {type: PathPrefix, value: /}
      - equal:
          path: spec.rules[2].backendRefs[0]
          value: {name: test-bosca-git-server, port: 8091}

  - it: exposes one backend Service port
    template: templates/service.yaml
    asserts:
      - contains:
          path: spec.ports
          content: {name: http, port: 8091, targetPort: http, protocol: TCP}
      - lengthEqual:
          path: spec.ports
          count: 1

  - it: customizes the external UI origin without adding a listener
    template: templates/httproute.yaml
    set:
      appConfig.uiUrl: https://build.example.com
    asserts:
      - equal:
          path: spec.rules[0].filters[0].requestRedirect.hostname
          value: build.example.com

  - it: uses the existing Gateway for backend traffic and UI redirects
    template: templates/httproute.yaml
    set:
      gateway.gatewayName: custom-gateway
      gateway.gatewayNamespace: ingress
    asserts:
      - equal:
          path: spec.parentRefs[0]
          value: {name: custom-gateway, namespace: ingress, port: 443}
