suite: bosca-git-server application.yaml configmap
templates:
  - templates/configmap-appconfig.yaml
values:
  - ../values.yaml
set:
  appConfig:
    domain: example.com
    databaseUrl: "jdbc:postgresql://postgres-bosca-rw:5432/bosca"
release:
  name: test
  namespace: bosca
tests:
  - it: does not require a Git-specific pipeline key configuration
    asserts:
      - notMatchRegex:
          path: data["application.yaml"]
          pattern: 'PIPELINE_SECRET_KEY|secretKey:.*pipeline'

  - it: configures both listeners and the browser authentication origin
    asserts:
      - matchRegex:
          path: data["application.yaml"]
          pattern: 'url: "https://git.example.com"'
      - matchRegex:
          path: data["application.yaml"]
          pattern: 'ui:\s+url: "https://git.example.com"\s+auth-cookie-prefix: ""\s+server:\s+port: 8093'
      - matchRegex:
          path: data["application.yaml"]
          pattern: 'allowed-origins:\s+- "https://git.example.com"'
      - matchRegex:
          path: data["application.yaml"]
          pattern: 'redirects:\s+- "https://git.example.com"'
      - matchRegex:
          path: data["application.yaml"]
          pattern: 'callback: "https://git.example.com/oauth2/google/callback"'
      - matchRegex:
          path: data["application.yaml"]
          pattern: 'cookie-secure: true'

  - it: uses custom API and UI origins consistently
    set:
      appConfig.gitUrl: https://code.custom.example/
      appConfig.appAllowedOrigins: [https://review.extra.example]
      appConfig.oauth2Redirects: [https://review.extra.example]
      ui.port: 18093
      ui.authCookiePrefix: _bat_git
      appConfig.authCookiePrefixes:
        - prefix: _bat_git
          domains: [code.custom.example]
    asserts:
      - matchRegex:
          path: data["application.yaml"]
          pattern: 'url: "https://code.custom.example"'
      - matchRegex:
          path: data["application.yaml"]
          pattern: 'callback: "https://code.custom.example/oauth2/google/callback"'
      - matchRegex:
          path: data["application.yaml"]
          pattern: 'auth-cookie-prefix: "_bat_git"\s+server:\s+port: 18093'
      - matchRegex:
          path: data["application.yaml"]
          pattern: 'allowed-origins:\s+- "https://code.custom.example"\s+- "https://review.extra.example"'
      - matchRegex:
          path: data["application.yaml"]
          pattern: 'redirects:\s+- "https://code.custom.example"\s+- "https://review.extra.example"'

  - it: derives origins and JWT settings from the global domain
    set:
      appConfig.domain: ""
      global.domain: global.example
    asserts:
      - matchRegex:
          path: data["application.yaml"]
          pattern: 'domain: "global.example"'
      - matchRegex:
          path: data["application.yaml"]
          pattern: 'url: "https://git.global.example"'
