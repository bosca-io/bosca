suite: bosca-git-server deployment
values:
  - ../values.yaml
set:
  global:
    domain: example.com
  appConfig:
    domain: example.com
    databaseUrl: "jdbc:postgresql://postgres-bosca-rw:5432/bosca"
    natsHost: nats
    meilisearchHost: meilisearch
tests:
  - it: renders a Deployment
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment

  - it: exposes port 8091
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8091

  - it: passes config arg
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: "-config=/app/config/application.yaml"

  - it: inherits the pipeline key from the shared server environment without overriding it
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: server-v3-env
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PIPELINE_SECRET_KEY
          any: true

  - it: does not override the shared pipeline key when old pipeline values are supplied
    template: templates/deployment.yaml
    set:
      secrets.pipeline.secretName: obsolete-pipeline
      secrets.pipeline.key: secret_key
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PIPELINE_SECRET_KEY
          any: true

  - it: injects MEILISEARCH_API_KEY
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEILISEARCH_API_KEY
            valueFrom:
              secretKeyRef:
                name: meilisearch-master-key
                key: MEILI_MASTER_KEY
