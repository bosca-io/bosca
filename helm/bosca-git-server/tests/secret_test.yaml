suite: bosca-git-server secret rendering
templates:
  - templates/secret.yaml
values:
  - ../values.yaml
release:
  name: test
  namespace: bosca
tests:
  - it: renders 6 secrets by default
    asserts:
      - hasDocuments:
          count: 6

  - it: does not create a separate pipeline Secret when old pipeline values are supplied
    set:
      secrets.pipeline.create: true
      secrets.pipeline.secretName: obsolete-pipeline
      secrets.pipeline.key: secret_key
      secrets.pipeline.value: obsolete-key
    asserts:
      - hasDocuments:
          count: 6

  - it: meilisearch-master-key uses MEILI_MASTER_KEY data key
    documentSelector:
      path: metadata.name
      value: meilisearch-master-key
    asserts:
      - exists:
          path: stringData.MEILI_MASTER_KEY

  - it: database Secret defaults to pg-creds-bosca-git-server
    documentSelector:
      path: metadata.name
      value: pg-creds-bosca-git-server
    asserts:
      - exists:
          path: stringData.username
      - exists:
          path: stringData.password

  - it: setting all create=false renders zero secrets
    set:
      secrets.database.create: false
      secrets.nats.create: false
      secrets.jwt.create: false
      secrets.meilisearch.create: false
      secrets.s3.create: false
      secrets.url.create: false
    asserts:
      - hasDocuments:
          count: 0
