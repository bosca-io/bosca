{{- if and .Values.gateway.enabled .Values.gateway.hostnames }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "bosca-common.fullname" . }}
  labels:
    {{- include "bosca-common.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.gatewayName }}
      {{- with .Values.gateway.gatewayNamespace }}
      namespace: {{ . }}
      {{- end }}
      port: 443
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- /* Gateway API allows at most eight matches per HTTPRoute rule. */}}
    {{- if or .Values.ui.enabled .Values.ui.serviceName }}
    {{- range chunk 8 (include "bosca-atlas-server.uiRoutes" . | fromYamlArray) }}
    - matches:
        {{- range . }}
        - path:
            type: RegularExpression
            value: {{ . | quote }}
        {{- end }}
      backendRefs:
        - name: {{ $.Values.ui.serviceName | default (include "bosca-common.fullname" $) }}
          port: {{ $.Values.ui.port }}
    {{- end }}
    {{- end }}
    - matches:
        {{- range list "^/[^/]+/[^/]+[.]git(/.*)?$" "^/[^/]+/[^/]+/raw(/.*)?$" "^/ci(/.*)?$" "^/api/webhooks(/.*)?$" }}
        - path:
            type: RegularExpression
            value: {{ . | quote }}
        {{- end }}
      backendRefs:
        - {{ include "bosca-atlas-server.gitBackend" . | nindent 10 | trim }}
    - matches:
        {{- range list "v2" "raw" "maven" "npm" "helm" "ml" }}
        - path: {type: PathPrefix, value: {{ printf "/%s" . | quote }}}
        {{- end }}
      backendRefs:
        - {{ include "bosca-atlas-server.artifactsBackend" . | nindent 10 | trim }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "bosca-common.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}

{{- if and .Values.gateway.enabled .Values.gateway.registryHostnames }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "bosca-common.fullname" . }}-registry
spec:
  parentRefs:
    - name: {{ .Values.gateway.gatewayName }}
      {{- with .Values.gateway.gatewayNamespace }}
      namespace: {{ . }}
      {{- end }}
      port: 443
  hostnames:
    {{- toYaml .Values.gateway.registryHostnames | nindent 4 }}
  rules:
    {{- if not .Values.backends.artifacts.serviceName }}
    {{- range list "raw" "maven" "npm" "helm" "ml" }}
    - matches:
        - path: {type: PathPrefix, value: {{ printf "/%s" . | quote }}}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ printf "/_artifacts/%s" . | quote }}
      backendRefs:
        - name: {{ include "bosca-common.fullname" $ }}
          port: {{ $.Values.service.port }}
    {{- end }}
    {{- end }}
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {{ include "bosca-atlas-server.artifactsBackend" . | nindent 10 | trim }}
{{- end }}
