suite: bosca-gateway Secret template
templates:
  - templates/secret.yaml
tests:
  - it: creates a Secret by default
    asserts:
      - isKind:
          of: Secret
      - exists:
          path: data["bosca-api-token"]

  - it: does not render a Secret when an existing one is provided
    set:
      secrets:
        existingSecret: my-pre-provisioned-secret
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: base64-encodes the supplied bosca-api-token
    set:
      secrets:
        boscaApiToken: my-token
    asserts:
      # base64("my-token") = bXktdG9rZW4=
      - equal:
          path: data["bosca-api-token"]
          value: "bXktdG9rZW4="
