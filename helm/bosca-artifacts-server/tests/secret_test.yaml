suite: bosca-artifacts-server secret rendering
templates:
  - templates/secret.yaml
values:
  - ../values.yaml
release:
  name: test
  namespace: bosca
tests:
  - it: renders 6 secrets by default
    asserts:
      - hasDocuments:
          count: 6

  - it: scrypt-key Secret has all four parameters
    documentSelector:
      path: metadata.name
      value: scrypt-key
    asserts:
      - exists:
          path: stringData.key
      - exists:
          path: stringData.salt
      - exists:
          path: stringData.mem_cost
      - exists:
          path: stringData.rounds

  - it: s3 Secret has access-key fields
    documentSelector:
      path: metadata.name
      value: s3
    asserts:
      - exists:
          path: stringData.ACCESS_KEY_ID
      - exists:
          path: stringData.ACCESS_SECRET_KEY

  - it: database Secret name defaults to pg-creds-bosca-artifacts-server
    documentSelector:
      path: metadata.name
      value: pg-creds-bosca-artifacts-server
    asserts:
      - exists:
          path: stringData.username

  - it: setting nats.create=false drops the nats Secret
    set:
      secrets.nats.create: false
    asserts:
      - hasDocuments:
          count: 5
