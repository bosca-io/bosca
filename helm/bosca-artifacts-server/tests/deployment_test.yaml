suite: bosca-artifacts-server deployment
values:
  - ../values.yaml
set:
  global:
    domain: example.com
  appConfig:
    domain: example.com
    databaseUrl: "jdbc:postgresql://postgres-bosca-rw:5432/bosca"
    natsHost: nats
tests:
  - it: renders a Deployment
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment

  - it: exposes port 8084
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8084

  - it: passes config arg
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: "-config=/app/config/application.yaml"

  - it: injects scrypt secrets
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCRYPT_SIGNER_KEY
            valueFrom:
              secretKeyRef:
                name: scrypt-key
                key: key
