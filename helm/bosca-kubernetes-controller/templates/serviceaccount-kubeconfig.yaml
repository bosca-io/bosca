{{- if .Values.autoRegister.enabled }}
# Dedicated ServiceAccount whose long-lived token is the credential that
# bosca-server uses (via the kubeconfig stored at register time) to talk
# to this Kubernetes cluster.
#
# Why this SA is separate from the controller pod's SA (templates/serviceaccount.yaml):
#   - The controller pod itself never uses an in-cluster fabric8 client;
#     every k8s API call goes through ClusterClientPool with a stored
#     kubeconfig. The deployment SA therefore needs no RBAC.
#   - Keeping the credential-bearing SA dedicated means no other workload
#     can accidentally pick up the auto-register token by being moved onto
#     this SA, and the ClusterRoleBinding has a single, named subject.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bosca-common.fullname" . }}-kubeconfig
  labels:
    {{- include "bosca-common.labels" . | nindent 4 }}
{{- end }}
