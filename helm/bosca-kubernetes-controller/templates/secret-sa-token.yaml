{{- if .Values.autoRegister.enabled }}
# Long-lived ServiceAccount token Secret for the auto-register flow.
#
# Why this exists: projected SA tokens mounted at
# /var/run/secrets/kubernetes.io/serviceaccount/token are bound to the
# requesting pod and default to a ~1h expiration. Snapshotting one of
# those into a stored kubeconfig (the original approach) produced a
# token that died as soon as the registration Job pod was deleted —
# every later fabric8 request came back 401.
#
# A Secret of type `kubernetes.io/service-account-token` with the
# `kubernetes.io/service-account.name` annotation is populated by
# kube-controller-manager's TokenController with `token`, `ca.crt`, and
# `namespace`. That token has no expiration and is not pod-bound, so
# the kubeconfig the register Job builds keeps working for the
# lifetime of the SA.
#
# K8s 1.24+ stopped auto-creating these Secrets but still supports
# them when created explicitly. See
# https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/#manual-secret-management-for-serviceaccounts
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bosca-common.fullname" . }}-sa-token
  labels:
    {{- include "bosca-common.labels" . | nindent 4 }}
  annotations:
    # Bound to the dedicated kubeconfig SA — see templates/serviceaccount-kubeconfig.yaml.
    # Not the deployment/Job pod SA: this token must not be reachable
    # from any pod that didn't explicitly mount this Secret.
    kubernetes.io/service-account.name: {{ include "bosca-common.fullname" . }}-kubeconfig
type: kubernetes.io/service-account-token
{{- end }}
