{{- if .Values.autoRegister.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bosca-common.fullname" . }}-register-cluster
  labels:
    {{- include "bosca-common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": {{ sub (atoi .Values.autoRegister.hookWeight) 1 | quote }}
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  register.sh: |
    #!/bin/sh
    # Bootstraps the host cluster as a Bosca-managed cluster.
    # Reads the long-lived ServiceAccount token from the SA-token Secret
    # (see templates/secret-sa-token.yaml), assembles a kubeconfig, and
    # calls bosca-server's `registerCluster` mutation.
    # Idempotent on CLUSTER_NAME — a re-run after success is a no-op.
    set -eu

    : "${SERVER_URL:?SERVER_URL not set}"
    : "${CLUSTER_NAME:?CLUSTER_NAME not set}"
    : "${CLUSTER_PROVIDER:?CLUSTER_PROVIDER not set}"
    : "${CLUSTER_ENVIRONMENT:?CLUSTER_ENVIRONMENT not set}"
    : "${ADMIN_IDENTIFIER:?ADMIN_IDENTIFIER not set}"
    : "${RETRIES:?RETRIES not set}"
    : "${RETRY_DELAY:?RETRY_DELAY not set}"
    : "${KUBERNETES_SERVICE_HOST:?KUBERNETES_SERVICE_HOST not set}"
    : "${KUBERNETES_SERVICE_PORT:?KUBERNETES_SERVICE_PORT not set}"

    # alpine has neither curl nor jq by default. Install on first run.
    if ! command -v curl >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
      apk add --no-cache curl jq >/dev/null
    fi

    GRAPHQL_URL="${SERVER_URL%/}/graphql"
    HEALTH_URL="${SERVER_URL%/}/api/v1/health"
    # Long-lived SA token Secret populated by kube-controller-manager. We do
    # NOT read /var/run/secrets/kubernetes.io/serviceaccount/token here: that
    # is a projected token bound to this Job pod and expires ~1h after issue
    # or as soon as the pod is deleted, whichever comes first.
    SA_DIR=/etc/bosca-sa-token

    # The TokenController populates the Secret asynchronously; the kubelet
    # then propagates it into the mount. Wait until both files appear and
    # are non-empty rather than racing the populate.
    echo "Waiting for ServiceAccount token Secret to be populated..."
    i=0
    while [ "$i" -lt "$RETRIES" ]; do
      if [ -s "$SA_DIR/token" ] && [ -s "$SA_DIR/ca.crt" ]; then
        echo "  SA token is populated."
        break
      fi
      i=$((i + 1))
      sleep "$RETRY_DELAY"
    done
    if [ "$i" -ge "$RETRIES" ]; then
      echo "Timed out waiting for SA token in $SA_DIR after $((RETRIES * RETRY_DELAY))s." >&2
      echo "Is kube-controller-manager running and watching Secrets of type kubernetes.io/service-account-token?" >&2
      exit 1
    fi

    SA_TOKEN=$(cat "$SA_DIR/token")
    CA_CERT_B64=$(base64 -w 0 < "$SA_DIR/ca.crt" 2>/dev/null || base64 < "$SA_DIR/ca.crt" | tr -d '\n')
    POD_NS=$(cat "$SA_DIR/namespace")
    APISERVER="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
    ADMIN_PASSWORD=$(cat /etc/bosca-bootstrap/admin_password)

    # The kubeconfig that bosca-server will encrypt and store. The token
    # comes from a Secret of type kubernetes.io/service-account-token
    # populated by kube-controller-manager — it has no expiration and is
    # not bound to any pod, so it stays valid for the SA's lifetime.
    KUBECONFIG_YAML=$(cat <<KCFG
    apiVersion: v1
    kind: Config
    current-context: ${CLUSTER_NAME}
    clusters:
    - name: ${CLUSTER_NAME}
      cluster:
        server: ${APISERVER}
        certificate-authority-data: ${CA_CERT_B64}
    contexts:
    - name: ${CLUSTER_NAME}
      context:
        cluster: ${CLUSTER_NAME}
        user: ${CLUSTER_NAME}
        namespace: ${POD_NS}
    users:
    - name: ${CLUSTER_NAME}
      user:
        token: ${SA_TOKEN}
    KCFG
    )

    echo "Waiting for bosca-server at $HEALTH_URL..."
    i=0
    while [ "$i" -lt "$RETRIES" ]; do
      if curl -fsS -m 5 "$HEALTH_URL" >/dev/null 2>&1; then
        echo "  bosca-server is reachable."
        break
      fi
      i=$((i + 1))
      sleep "$RETRY_DELAY"
    done
    if [ "$i" -ge "$RETRIES" ]; then
      echo "bosca-server health check failed after $RETRIES attempts." >&2
      exit 1
    fi

    echo "Authenticating as '$ADMIN_IDENTIFIER'..."
    LOGIN_PAYLOAD=$(jq -cn --arg id "$ADMIN_IDENTIFIER" --arg pw "$ADMIN_PASSWORD" '{
      query: "mutation Login($identifier: String!, $password: String!) { security { login { password(identifier: $identifier, password: $password) { token { token } } } } }",
      variables: { identifier: $id, password: $pw }
    }')
    LOGIN_RESPONSE=$(curl -sS -m 10 -H 'Content-Type: application/json' -d "$LOGIN_PAYLOAD" "$GRAPHQL_URL")
    JWT=$(printf '%s' "$LOGIN_RESPONSE" | jq -r '.data.security.login.password.token.token // empty')
    if [ -z "$JWT" ]; then
      echo "Admin login failed. Server response:" >&2
      printf '%s\n' "$LOGIN_RESPONSE" >&2
      exit 1
    fi

    echo "Checking whether '$CLUSTER_NAME' is already registered..."
    LIST_PAYLOAD='{"query":"query { kubernetes { clusters { name } } }"}'
    LIST_RESPONSE=$(curl -sS -m 10 \
      -H "Authorization: Bearer $JWT" \
      -H 'Content-Type: application/json' \
      -d "$LIST_PAYLOAD" "$GRAPHQL_URL")
    EXISTS=$(printf '%s' "$LIST_RESPONSE" | jq -r --arg n "$CLUSTER_NAME" '
      [.data.kubernetes.clusters[]? | select(.name == $n)] | length
    ')
    if [ "$EXISTS" != "0" ]; then
      echo "Cluster '$CLUSTER_NAME' is already registered; nothing to do."
      exit 0
    fi

    echo "Registering cluster '$CLUSTER_NAME'..."
    REGISTER_PAYLOAD=$(jq -cn \
      --arg name "$CLUSTER_NAME" \
      --arg provider "$CLUSTER_PROVIDER" \
      --arg region "${CLUSTER_REGION:-}" \
      --arg env "$CLUSTER_ENVIRONMENT" \
      --arg kc "$KUBECONFIG_YAML" '{
        query: "mutation RegisterCluster($input: RegisterClusterInput!) { kubernetes { registerCluster(input: $input) { id name } } }",
        variables: {
          input: {
            name: $name,
            provider: $provider,
            region: $region,
            environment: $env,
            kubeconfig: $kc
          }
        }
      }')

    REGISTER_RESPONSE=$(curl -sS -m 30 \
      -H "Authorization: Bearer $JWT" \
      -H 'Content-Type: application/json' \
      -d "$REGISTER_PAYLOAD" "$GRAPHQL_URL")
    ID=$(printf '%s' "$REGISTER_RESPONSE" | jq -r '.data.kubernetes.registerCluster.id // empty')
    if [ -z "$ID" ]; then
      echo "Registration failed. Server response:" >&2
      printf '%s\n' "$REGISTER_RESPONSE" >&2
      exit 1
    fi
    echo "Registered cluster '$CLUSTER_NAME' (id=$ID)."
{{- end }}
