suite: bosca-kubernetes-controller secret rendering
templates:
  - templates/secret.yaml
values:
  - ../values.yaml
release:
  name: test
  namespace: bosca
tests:
  - it: renders 4 secrets by default
    asserts:
      - hasDocuments:
          count: 4

  - it: database Secret defaults to pg-creds-bosca-kubernetes-controller
    documentSelector:
      path: metadata.name
      value: pg-creds-bosca-kubernetes-controller
    asserts:
      - exists:
          path: stringData.username
      - exists:
          path: stringData.password

  - it: cfg Secret carries secret key
    documentSelector:
      path: metadata.name
      value: cfg
    asserts:
      - exists:
          path: stringData.secret

  - it: setting cfg.create=false drops the cfg Secret
    set:
      secrets.cfg.create: false
    asserts:
      - hasDocuments:
          count: 3
