apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: jobprofiles.kubernetes.bosca.io
spec:
  group: kubernetes.bosca.io
  scope: Namespaced
  names:
    plural: jobprofiles
    singular: jobprofile
    kind: JobProfile
    shortNames:
      - jp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Active
          type: integer
          jsonPath: .status.activeJobs
        - name: Max
          type: integer
          jsonPath: .spec.maxParallelism
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - podTemplate
              properties:
                maxParallelism:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  default: 1
                workerContainerName:
                  type: string
                  minLength: 1
                  default: worker
                job:
                  type: object
                  properties:
                    backoffLimit:
                      type: integer
                      minimum: 0
                      default: 0
                    ttlSecondsAfterFinished:
                      type: integer
                      minimum: 0
                    activeDeadlineSeconds:
                      type: integer
                      format: int64
                      minimum: 1
                      default: 86400
                    startupFailureGraceSeconds:
                      type: integer
                      format: int64
                      minimum: 0
                      default: 120
                podTemplate:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                activeJobs:
                  type: integer
                lastReconciledAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
