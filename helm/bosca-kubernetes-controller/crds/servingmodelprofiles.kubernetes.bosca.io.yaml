apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: servingmodelprofiles.kubernetes.bosca.io
spec:
  group: kubernetes.bosca.io
  scope: Namespaced
  names:
    plural: servingmodelprofiles
    singular: servingmodelprofile
    kind: ServingModelProfile
    shortNames: [smp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [boscaUrl, tokenSecretName, controlTokenSecretName, serviceNamePrefix, podTemplate]
              properties:
                boscaUrl: {type: string, minLength: 1}
                tokenSecretName: {type: string, minLength: 1}
                tokenSecretKey: {type: string, default: artifacts_pull_token}
                controlTokenSecretName: {type: string, minLength: 1}
                controlTokenSecretKey: {type: string, default: bosca_token}
                serviceNamePrefix:
                  type: string
                  maxLength: 42
                  pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?-$'
                servicePort: {type: integer, minimum: 1, maximum: 65535, default: 8501}
                modelBasePath: {type: string, default: /models}
                maxCandidates: {type: integer, minimum: 1, default: 1}
                drainSeconds: {type: integer, minimum: 0, default: 120}
                startupTimeoutSeconds: {type: integer, minimum: 1, default: 1800}
                failureGraceSeconds: {type: integer, minimum: 0, default: 600}
                podTemplate:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
