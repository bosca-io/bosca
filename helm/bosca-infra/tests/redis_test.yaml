suite: bosca-infra Redis (Dragonfly)
templates:
  - templates/redis.yaml
values:
  - ../values.yaml
set:
  global:
    domain: example.com
tests:
  - it: renders Dragonfly CR named redis
    asserts:
      - isKind:
          of: Dragonfly
      - equal:
          path: metadata.name
          value: redis

  - it: pins the Dragonfly image
    asserts:
      - equal:
          path: spec.image
          value: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2

  - it: honors the Dragonfly image override
    set:
      redis:
        image: registry.example.com/dragonfly:v2.0.2
    asserts:
      - equal:
          path: spec.image
          value: registry.example.com/dragonfly:v2.0.2

  - it: includes cluster_mode emulated arg
    asserts:
      - contains:
          path: spec.args
          content: "--cluster_mode=emulated"

  - it: does not render when disabled
    set:
      redis:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
