replicaCount: 1

image:
  registry: ghcr.io/bosca-io/bosca
  repository: bosca-server
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

commonAnnotations: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080
  # Gateway-facing h2c port. Both Service ports target the same Bosca listener.
  http2Port: 8081

gateway:
  enabled: true
  gatewayName: bosca-gateway
  gatewayNamespace: ""
  hostnames: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Liveness only restarts a wedged process. It hits the cheap /api/v1/live endpoint
# (no DB/cache/pool access) and is given generous timeout/failure budget so a load
# spike or slow dependency can't trigger a restart storm. Dependency health is the
# job of readinessProbe (/ready) and startupProbe (/health), neither of which restarts.
livenessProbe:
  httpGet:
    path: /api/v1/live
    port: management
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /api/v1/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5

startupProbe:
  httpGet:
    path: /api/v1/health
    port: http
  failureThreshold: 30
  periodSeconds: 5

# Application config template values — rendered into application.yaml ConfigMap.
# These replace the [PLACEHOLDER] tokens from the CLI's template.
appConfig:
  domain: ""
  realm: ""
  # Additional host-only authentication cookie prefixes. `_bat` remains the default
  # for domains not listed here.
  authCookiePrefixes: []
  # Compress eligible HTTP responses in Bosca. Disable when the gateway handles compression.
  compressionEnabled: true
  # Opt in to h2c only when the selected Gateway implementation supports backend
  # protocol selection. Client-facing HTTP/2 can remain enabled at the Gateway.
  http2Enabled: false
  # Bound per-connection HTTP/2 resource usage while allowing multiplexed application traffic.
  http2MaxConcurrentStreams: 100
  autoVerify: false
  # CI runner labels dispatched through the shared `kubernetes-jobs` queue.
  # Each value must match a JobProfile name. Empty preserves polling agents.
  kubernetesJobProfiles: []
  # Cluster-internal base URL of bml-message-server (BML email template rendering).
  # Empty keeps the application default (http://bml-message-server:9093); umbrella
  # deployments must set the release-prefixed service name, e.g.
  # http://bosca-bml-message-server:9093.
  bmlMessageServerUrl: ""
  # Enables the ecommerce module (catalogs, carts, payments, subscriptions,
  # fulfillment). Defaults off; set to true to pull in the ecom schema,
  # providers, GraphQL surface, and migrations. Must match the bosca-runner
  # chart's ecommerceEnabled so both apps agree on the module's state.
  ecommerceEnabled: false
  databaseUrl: ""
  databaseMaxConnections: 500
  # Fully qualified Trino events table used by experimentation and recommendation analytics queries.
  # Override per deployment when its Iceberg namespace differs (for example warehouse.passion.events).
  experimentationEventsTable: warehouse.bosca.events
  natsHost: nats
  meilisearchHost: meilisearch
  # Email provider implementation: sendgrid or mailgun. Credentials live in encrypted
  # platform configuration under the provider's key.
  mailerType: sendgrid
  mailerFromName: "Support"
  # Empty = noreply@<domain>.
  mailerFromEmail: ""
  # Public unsubscribe / manage-preferences pages minted tokens are appended to (?token=...).
  # Empty = default to https://studio.<domain>/unsubscribe in the configmap.
  mailerUnsubscribeUrl: ""
  mailerPreferencesUrl: ""
  localizationSuffix: ""
  # Public origin of the Studio web app (auth email links derive from this).
  # Empty = default to https://admin.<domain> in the configmap.
  appUrl: ""
  # Absolute account-security page linked from security-alert emails.
  # Empty falls back to appUrl.
  securityAlertUrl: ""
  # Public origin used for chat notification deep links.
  # Empty falls back to appUrl.
  socialNotificationsUrl: ""
  # Public origin used for friend-request notification deep links.
  # Empty defaults to https://profiles.<domain>.
  profileNotificationsUrl: ""
  # Public onboarding URL used by the welcome email call to action.
  # Empty falls back to <appUrl>/welcome in the application.
  welcomeEmailUrl: ""
  # Hosts an auth email link may route back to (multi-host). Empty = just https://admin.<domain>.
  appAllowedOrigins: []
  indexExcludeTypes: []
  indexExcludeContentTypePrefix: []
  oauth2Redirects: []
  # Additional Google OAuth2 client IDs whose id_token `aud` claim is accepted
  # alongside the primary GOOGLE_CLIENT_ID. Use when native/mobile apps sign in
  # with their own Google client IDs but share this backend. Client IDs are
  # public identifiers (not secrets), so they live here rather than in a Secret.
  # Empty = only the primary client ID is accepted.
  googleSupportedClientIds: []
  # Override any part of the rendered `content:` block in application.yaml.
  # Defaults live in templates/configmap-appconfig.yaml; anything you set here
  # is deep-merged on top (lists like images.resizer.sizes are replaced, not
  # appended). Leave empty to use the chart defaults. Example:
  #   content:
  #     storage:
  #       bucket: my-bucket
  #       region: us-west-2
  #     images:
  #       resizer:
  #         sizes:
  #           - name: thumbnail
  #             ratio: 25
  #             size: { height: 200, width: 400 }
  content: {}

# Shared ConfigMaps injected via envFrom (same as CLI's server-v3-env + otel-env).
envFromConfigMaps:
  - server-v3-env
  - otel-env

# Secrets
#
# Each entry maps a logical secret (e.g., "database") to a Kubernetes Secret.
# The `*Key` fields name the keys inside that Secret; the value fields hold
# the actual secret contents.
#
# `create: true`  → chart renders the Secret resource from the value fields below
# `create: false` → chart only references the existing Secret (you create it
#                   yourself with kubectl / ExternalSecrets / SealedSecrets / etc.)
#
# Defaults to `create: true` so fresh installs work end-to-end. When migrating
# from an environment where Secrets already exist, flip to `create: false`.
secrets:
  initialization:
    create: true
    secretName: initialization
    key: admin_password
    envVar: INITIAL_ADMIN_PASSWORD
    value: ""
  database:
    create: true
    secretName: pg-creds-bosca-server
    usernameKey: username
    passwordKey: password
    username: ""
    password: ""
  meilisearch:
    create: true
    secretName: meilisearch-master-key
    key: MEILI_MASTER_KEY
    value: ""
  nats:
    create: true
    secretName: nats
    key: token
    value: ""
  url:
    create: true
    secretName: url
    key: secret
    value: ""
  jwt:
    create: true
    secretName: jwt
    key: secret
    value: ""
  google:
    create: true
    secretName: google
    clientIdKey: client_id
    clientSecretKey: client_secret
    clientId: ""
    clientSecret: ""
  googleAccount:
    create: true
    secretName: google-account
    key: account
    value: ""
  gemini:
    create: true
    secretName: gemini-api-key
    key: key
    value: ""
  openai:
    create: true
    secretName: openai-token
    key: token
    value: ""
  cfg:
    create: true
    secretName: cfg
    key: secret
    value: ""
  s3:
    create: true
    secretName: s3
    accessKeyIdKey: ACCESS_KEY_ID
    secretAccessKeyKey: ACCESS_SECRET_KEY
    accessKeyId: ""
    secretAccessKey: ""
  hubspot:
    create: true
    secretName: hubspot
    key: token
    value: ""
  scrypt:
    create: true
    secretName: scrypt-key
    keyKey: key
    saltKey: salt
    memCostKey: mem_cost
    roundsKey: rounds
    key: ""
    salt: ""
    memCost: ""
    rounds: ""
  facebook:
    create: true
    secretName: facebook
    appIdKey: app_id
    appSecretKey: app_secret
    appId: ""
    appSecret: ""
  # Shared bearer token authenticating the Rust gateway proxy to
  # `/api/v1/gateway/config`. Defaults to the same Secret name + key the
  # bosca-gateway chart consumes (`bosca-gateway` / `bosca-api-token`) so
  # the umbrella only needs `create: false` to delegate to secrets.yaml.
  gatewayProxy:
    create: true
    secretName: bosca-gateway
    key: bosca-api-token
    value: ""

imagePullSecrets:
  - name: docker-registry

nodeSelector: {}
tolerations: []
affinity: {}

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0

global:
  # Registry (and path) for every Bosca image; when set, it overrides image.registry.
  imageRegistry: ""
  domain: ""
  # Shared by bosca-server and bosca-runner in umbrella deployments.
  ciKubernetesJobProfiles: []

# Port of the management listener (bosca.server.management-port). It serves GET /api/v1/live on its own event loop,
# so liveness keeps answering while request event loops are busy. Every /api/v1/live probe targets it; readiness
# stays on `http` because it checks dependencies.
managementPort: 9090
