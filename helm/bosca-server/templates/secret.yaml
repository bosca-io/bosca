{{- /*
Renders one Kubernetes Secret per entry in .Values.secrets where `create: true`.
Secret values come from the value fields on each entry; the *Key fields name
the keys inside the Secret (so the deployment's secretKeyRef references match).

To consume an externally-managed Secret instead of having helm create one,
set `create: false` on that entry. The deployment will still reference it by
secretName.
*/}}
{{- $labels := include "bosca-common.labels" . -}}

{{- with .Values.secrets.initialization }}
{{- if .create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .secretName }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
stringData:
  {{ .key }}: {{ .value | quote }}
{{- end }}
{{- end }}

