apiVersion: v1
kind: Service
metadata:
  name: {{ include "bosca-common.fullname" . }}
  labels:
    {{- include "bosca-common.labels" . | nindent 4 }}
  annotations:
    {{- include "bosca-common.annotations" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.appConfig.http2Enabled }}
    - port: {{ .Values.service.http2Port }}
      targetPort: http
      protocol: TCP
      name: h2c
      appProtocol: kubernetes.io/h2c
    {{- end }}
  selector:
    {{- include "bosca-common.selectorLabels" . | nindent 4 }}
