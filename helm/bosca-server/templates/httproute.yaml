{{- if and .Values.gateway.enabled .Values.gateway.hostnames }}
{{- /*
Main HTTPRoute for the bosca-server API. Name follows the legacy CLI
convention `<domain-slug>` (e.g., example-com) — this is THE root
route, no subdomain prefix. Hostnames come from gateway.hostnames and
typically include the primary domain plus every api / upload / ws
subdomain that should land on bosca-server.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.global.domain | replace "." "-" | quote }}
  labels:
    {{- include "bosca-common.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.gatewayName }}
      {{- with .Values.gateway.gatewayNamespace }}
      namespace: {{ . }}
      {{- end }}
      port: 443
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "bosca-common.fullname" . }}
          port: {{ ternary .Values.service.http2Port .Values.service.port .Values.appConfig.http2Enabled }}
{{- end }}
