apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bosca-common.fullname" . }}
  labels:
    {{- include "bosca-common.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 1 }}
  selector:
    matchLabels:
      {{- include "bosca-common.selectorLabels" . | nindent 6 }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "bosca-common.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/appconfig: {{ include (print $.Template.BasePath "/configmap-appconfig.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "bosca-common.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "bosca-common.podSecurityContext" . | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "bosca-common.boscaImage" (dict "image" (merge (dict "tag" (default .Chart.AppVersion .Values.image.tag)) .Values.image) "global" .Values.global) }}
          imagePullPolicy: {{ include "bosca-common.imagePullPolicy" .Values.image }}
          args: ["-config=/app/config/application.yaml"]
          securityContext:
            {{- include "bosca-common.securityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: {{ $.Values.managementPort }}
              protocol: TCP
          envFrom:
            {{- range .Values.envFromConfigMaps }}
            - configMapRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=65.0"
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: K8S_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            {{- with .Values.appConfig.bmlMessageServerUrl }}
            - name: BML_MESSAGE_SERVER_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.appConfig.welcomeEmailUrl }}
            - name: WELCOME_EMAIL_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.secrets.initialization.secretName }}
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.initialization.key }}
            {{- end }}
            {{- with .Values.secrets.database.secretName }}
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.database.usernameKey }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.database.passwordKey }}
            {{- end }}
            {{- with .Values.secrets.meilisearch.secretName }}
            - name: MEILISEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.meilisearch.key }}
            - name: SEARCH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.meilisearch.key }}
            {{- end }}
            {{- with .Values.secrets.nats.secretName }}
            - name: NATS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.nats.key }}
            {{- end }}
            {{- with .Values.secrets.url.secretName }}
            - name: URL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.url.key }}
            {{- end }}
            {{- with .Values.secrets.jwt.secretName }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.jwt.key }}
            {{- end }}
            {{- with .Values.secrets.google.secretName }}
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.google.clientIdKey }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.google.clientSecretKey }}
            {{- end }}
            {{- with .Values.secrets.googleAccount.secretName }}
            - name: GOOGLE_TTS_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.googleAccount.key }}
            {{- end }}
            {{- with .Values.secrets.googleAccount.secretName }}
            - name: GOOGLE_GENAI_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.googleAccount.key }}
            {{- end }}
            {{- with .Values.secrets.gemini.secretName }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.gemini.key }}
            {{- end }}
            {{- with .Values.secrets.openai.secretName }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.openai.key }}
            {{- end }}
            {{- with .Values.secrets.cfg.secretName }}
            - name: SECURITY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.cfg.key }}
            {{- end }}
            {{- with .Values.secrets.s3.secretName }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.s3.accessKeyIdKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.s3.secretAccessKeyKey }}
            {{- end }}
            {{- with .Values.secrets.hubspot.secretName }}
            - name: HUBSPOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.hubspot.key }}
            {{- end }}
            {{- with .Values.secrets.scrypt.secretName }}
            - name: SCRYPT_SIGNER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.scrypt.keyKey }}
            - name: SCRYPT_SALT_SEPARATOR
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.scrypt.saltKey }}
            - name: SCRYPT_MEM_COST
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.scrypt.memCostKey }}
            - name: SCRYPT_ROUNDS
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.scrypt.roundsKey }}
            {{- end }}
            {{- with .Values.secrets.facebook.secretName }}
            - name: FACEBOOK_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.facebook.appIdKey }}
            - name: FACEBOOK_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.facebook.appSecretKey }}
            {{- end }}
            - name: KUBERNETES_CONTROLLER_URL
              value: http://{{ .Release.Name }}-bosca-kubernetes-controller.{{ .Release.Namespace }}.svc.cluster.local:8082
            {{- with .Values.secrets.gatewayProxy.secretName }}
            - name: GATEWAY_PROXY_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.gatewayProxy.key }}
            {{- end }}
          volumeMounts:
            - name: app-config
              mountPath: /app/config
              readOnly: true
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: app-config
          configMap:
            name: {{ include "bosca-common.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
