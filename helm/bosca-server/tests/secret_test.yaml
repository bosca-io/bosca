suite: bosca-server secret rendering
templates:
  - templates/secret.yaml
values:
  - ../values.yaml
release:
  name: test
  namespace: bosca
tests:
  - it: renders 16 secrets when all create:true defaults
    asserts:
      - hasDocuments:
          count: 16

  - it: initialization Secret has admin_password key
    documentSelector:
      path: metadata.name
      value: initialization
    asserts:
      - exists:
          path: stringData.admin_password

  - it: database Secret uses default chart name
    documentSelector:
      path: metadata.name
      value: pg-creds-bosca-server
    asserts:
      - exists:
          path: stringData.username
      - exists:
          path: stringData.password

  - it: provided database password flows into Secret stringData
    set:
      secrets.database.password: hunter2
    documentSelector:
      path: metadata.name
      value: pg-creds-bosca-server
    asserts:
      - equal:
          path: stringData.password
          value: hunter2

  - it: setting nats.create=false drops the nats Secret
    set:
      secrets.nats.create: false
    asserts:
      - hasDocuments:
          count: 15

  - it: gatewayProxy Secret defaults to bosca-gateway / bosca-api-token
    documentSelector:
      path: metadata.name
      value: bosca-gateway
    asserts:
      - exists:
          path: stringData.bosca-api-token

  - it: overriding secretName changes the rendered Secret name
    set:
      secrets.database.secretName: postgres-bosca
    documentSelector:
      path: metadata.name
      value: postgres-bosca
    asserts:
      - isKind:
          of: Secret
