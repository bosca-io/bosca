suite: Atlas and companion hostname TLS and HTTP redirects
templates: [templates/gateway.yaml, templates/httproute-redirect.yaml]
set:
  bosca-atlas-server:
    enabled: true
    gateway:
      enabled: true
      hostnames: [atlas.example.com]
      gitHostnames: [git.example.com]
      registryHostnames: [artifacts.example.com]
tests:
  - it: creates a TLS listener and certificate for each Atlas hostname
    template: templates/gateway.yaml
    asserts:
      - lengthEqual:
          path: spec.listeners
          count: 4
      - equal:
          path: spec.listeners[1].hostname
          value: atlas.example.com
      - equal:
          path: spec.listeners[2].tls.certificateRefs[0].name
          value: git-example-com-tls
      - equal:
          path: spec.listeners[3].tls.certificateRefs[0].name
          value: artifacts-example-com-tls
  - it: redirects all three public hostnames to HTTPS
    template: templates/httproute-redirect.yaml
    asserts:
      - equal:
          path: spec.hostnames
          value: [atlas.example.com, git.example.com, artifacts.example.com]
