{{- /*
Studio-domain HTTPRoute (studio.* hostnames). Mirrors the admin path
split so the studio frontend can hit bosca-server APIs and bosca-collector
analytics on the same origin.

Three rules:
  1. /api/v1/events,installation → bosca-collector
  2. /graphql,/graphqlws,/oauth2,/api/v1,/files,/content → bosca-server
  3. /                           → bosca-studio (catch-all)
*/ -}}
{{- $studio := index .Values "bosca-studio" -}}
{{- $collector := index .Values "bosca-collector" -}}
{{- $server := index .Values "bosca-server" -}}
{{- $serverHttp2Enabled := dig "appConfig" "http2Enabled" false $server -}}
{{- $serverHttp2Port := dig "service" "http2Port" 8081 $server -}}
{{- if and
    .Values.gateway.enabled
    $studio.enabled
    $studio.gateway.enabled
    $studio.gateway.hostnames
    $server.enabled
}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "studio-%s" (.Values.global.domain | replace "." "-") | quote }}
  labels:
    app.kubernetes.io/part-of: bosca
spec:
  parentRefs:
    - name: {{ .Values.gateway.name | default "bosca-gateway" | quote }}
      port: 443
  hostnames:
{{- range $h := $studio.gateway.hostnames }}
    - {{ $h | quote }}
{{- end }}
  rules:
{{- if $collector.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/events
        - path:
            type: PathPrefix
            value: /api/v1/installation
      backendRefs:
        - name: {{ printf "%s-bosca-collector" $.Release.Name | quote }}
          port: {{ $collector.service.port | default 8080 }}
{{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /graphql
        - path:
            type: PathPrefix
            value: /oauth2
        - path:
            type: PathPrefix
            value: /api/v1
        - path:
            type: PathPrefix
            value: /files
        - path:
            type: PathPrefix
            value: /content
        - path:
            type: PathPrefix
            value: /graphqlws
      backendRefs:
        - name: {{ printf "%s-bosca-server" $.Release.Name | quote }}
          port: {{ ternary $serverHttp2Port ($server.service.port | default 8080) $serverHttp2Enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ printf "%s-bosca-studio" $.Release.Name | quote }}
          port: {{ $studio.service.port | default 3000 }}
{{- end }}
