{{- /*
Profiles self-service account site HTTPRoute.

The profiles application is a BML server-side-rendered site that proxies
/graphql and /oauth2 same-origin to bosca-server. A single catch-all therefore
keeps browser authentication and application traffic on the profiles host.
*/ -}}
{{- $profilesWeb := index .Values "profiles-web" -}}
{{- if and
    .Values.gateway.enabled
    $profilesWeb.enabled
    $profilesWeb.gateway.enabled
    $profilesWeb.gateway.hostnames
}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "profiles-web-%s" (.Values.global.domain | replace "." "-") | quote }}
  labels:
    app.kubernetes.io/part-of: bosca
spec:
  parentRefs:
    - name: {{ .Values.gateway.name | default "bosca-gateway" | quote }}
      port: 443
  hostnames:
{{- range $h := $profilesWeb.gateway.hostnames }}
    - {{ $h | quote }}
{{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ printf "%s-profiles-web" $.Release.Name | quote }}
          port: {{ $profilesWeb.service.port | default 9095 }}
{{- end }}
