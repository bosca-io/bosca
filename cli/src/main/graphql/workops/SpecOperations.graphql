query GetWorkOpsSpecChildren($parentSpecId: UUID!, $offset: Long! = 0, $limit: Int! = 50) {
    workOps {
        specs {
            children(parentSpecId: $parentSpecId, offset: $offset, limit: $limit) {
                ...WorkOpsSpecFragment
            }
        }
    }
}

query GetWorkOpsSpecHistory($specId: UUID!, $offset: Long! = 0, $limit: Int! = 50) {
    workOps {
        specs {
            spec(id: $specId) {
                id
                key
                history(offset: $offset, limit: $limit) {
                    id
                    specId
                    changedAt
                    changedByPrincipalId
                    changedByProfileId
                    changes {
                        fieldKey
                        fieldName
                        fromValue
                        toValue
                    }
                }
            }
        }
    }
}

query GetWorkOpsSpecContexts($specId: UUID!) {
    workOps {
        specs {
            spec(id: $specId) {
                id
                key
                contexts {
                    id
                    specId
                    contextType
                    targetId
                    label
                    attributes
                    addedByProfileId
                    createdAt
                }
            }
        }
    }
}

mutation CreateWorkOpsSpec($input: CreateWorkOpsSpecInput!) {
    workOps {
        specs {
            create(input: $input) {
                ...WorkOpsSpecFragment
            }
        }
    }
}

mutation UpdateWorkOpsSpec($id: UUID!, $input: UpdateWorkOpsSpecInput!) {
