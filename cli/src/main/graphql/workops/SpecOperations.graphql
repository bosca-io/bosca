query GetWorkOpsSpecComments($specId: UUID!, $offset: Long! = 0, $limit: Long! = 50) {
    workOps {
        specComments {
            forSpec(specId: $specId, offset: $offset, limit: $limit) {
                id
                parentId
                specId
                profileId
                visibility
                created
                modified
                status
                content
                likes
                deleted
            }
        }
    }
}

mutation AddWorkOpsSpecComment($specId: UUID!, $input: WorkOpsSpecCommentInput!) {
    workOps {
        specComments {
            add(specId: $specId, input: $input) {
                id
                parentId
                specId
                profileId
                content
                created
                visibility
                status
            }
        }
    }
}

mutation DeleteWorkOpsSpecComment($specId: UUID!, $commentId: Long!) {
    workOps {
        specComments {
            delete(specId: $specId, commentId: $commentId)
        }
    }
}

query GetWorkOpsRequirement($id: UUID!) {
    workOps {
        requirements {
            requirement(id: $id) {
                id
                key
                metadataId
                parentType
                parentId
                sortOrder
                labelIds
                deletedAt
                createdAt
                modifiedAt
                createdByPrincipalId
                modifiedByPrincipalId
                version
                status {
                    id
                    name
                    category
                }
                priority {
                    id
                    name
                    displayOrder
                }
                assigneeProfileId
                taskId
            }
        }
    }
}

