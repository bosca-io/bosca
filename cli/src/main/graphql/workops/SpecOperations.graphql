query GetWorkOpsSpec($id: UUID!) {
    workOps {
        specs {
            spec(id: $id) {
                ...WorkOpsSpecFragment
            }
        }
    }
}

query GetWorkOpsSpecByKey($key: String!) {
    workOps {
        specs {
            specByKey(key: $key) {
                ...WorkOpsSpecFragment
            }
        }
    }
}

query GetWorkOpsSpecsByProject($projectId: UUID!, $offset: Long! = 0, $limit: Int! = 50) {
    workOps {
        specs {
            byProject(projectId: $projectId, offset: $offset, limit: $limit) {
                ...WorkOpsSpecFragment
            }
        }
    }
}

query GetWorkOpsSpecsByProgram($programId: UUID!, $offset: Long! = 0, $limit: Int! = 50) {
    workOps {
