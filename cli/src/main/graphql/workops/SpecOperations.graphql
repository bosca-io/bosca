        specs {
            generateTasks(specId: $specId, metadataVersion: $metadataVersion, source: $source, agentSessionId: $agentSessionId) {
                id
                specId
                metadataVersion
                source
                agentSessionId
                generatedTaskIds
                createdAt
                createdByPrincipalId
            }
        }
    }
}

