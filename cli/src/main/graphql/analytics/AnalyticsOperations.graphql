mutation AddAnalyticsDashboardVisualization(
    $dashboardId: UUID!,
    $visualizationId: UUID!,
    $configuration: JSON
) {
    analytics {
        dashboards {
            addVisualization(
                dashboardId: $dashboardId,
                visualizationId: $visualizationId,
                configuration: $configuration
            )
        }
    }
}

