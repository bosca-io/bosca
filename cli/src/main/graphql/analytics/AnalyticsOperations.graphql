query ListAnalyticsQueries {
    analytics {
        queries {
            all {
                ...AnalyticsQuerySummaryFragment
            }
        }
    }
}

query GetAnalyticsQueryById($id: UUID!) {
    analytics {
        queries {
            queryById(id: $id) {
                ...AnalyticsQueryFragment
            }
        }
    }
}

query GetAnalyticsQueryByKey($key: String!) {
    analytics {
        queries {
            queryByKey(key: $key) {
                ...AnalyticsQueryFragment
            }
        }
    }
}

query ExecuteAnalyticsQuery($queryId: UUID!, $parameters: [AnalyticsQueryExecutionParameterInput!]!) {
    analytics {
        queries {
            execute(queryId: $queryId, parameters: $parameters) {
                records
                cached
                refreshedAt
            }
        }
    }
}

query ExecuteAnalyticsQueryByKey($key: String!, $parameters: [AnalyticsQueryExecutionParameterInput!]!) {
    analytics {
        queries {
            executeByKey(key: $key, parameters: $parameters) {
                records
                cached
                refreshedAt
            }
        }
    }
}

mutation AddAnalyticsQuery($query: AnalyticsQueryInput!) {
    analytics {
        queries {
            add(query: $query) {
                ...AnalyticsQueryFragment
            }
        }
    }
}

mutation EditAnalyticsQuery($query: AnalyticsQueryInput!) {
    analytics {
        queries {
            edit(query: $query) {
                ...AnalyticsQueryFragment
            }
        }
    }
}

mutation DeleteAnalyticsQuery($id: UUID!) {
    analytics {
        queries {
            delete(id: $id)
        }
    }
}

mutation RefreshAnalyticsQuery($queryId: UUID!) {
    analytics {
        queries {
            refresh(queryId: $queryId)
        }
    }
}

mutation AddAnalyticsQueryPermission($permission: PermissionInput!) {
    analytics {
        queries {
            addPermission(permission: $permission) {
                action
                groupId
            }
        }
    }
}

mutation DeleteAnalyticsQueryPermission($permission: PermissionInput!) {
    analytics {
        queries {
            deletePermission(permission: $permission) {
                action
                groupId
            }
        }
    }
}

