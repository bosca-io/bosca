query GetMetadata($id: UUID!, $version: Int) {
    content {
        metadata(id: $id, version: $version) {
            ...Metadata
        }
    }
}

query GetMetadataUpload($id: UUID!) {
    content {
        metadata(id: $id) {
            content {
                ...MetadataContentUpload
            }
        }
    }
}