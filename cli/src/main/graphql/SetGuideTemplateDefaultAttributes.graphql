mutation SetGuideTemplateDefaultAttributes($metadataId: UUID!, $metadataVersion: Int!, $attributes: JSON!) {
    content {
        metadata {
            guideTemplate(metadataId: $metadataId, metadataVersion: $metadataVersion) {
                setDefaultAttributes(attributes: $attributes) {
                    ...Metadata
                }
            }
        }
    }
}
