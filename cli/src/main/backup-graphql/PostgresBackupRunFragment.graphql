fragment PostgresBackupRunFragment on PostgresBackupRun {
    key
    sourceId
    storageKey
    prefix
    status
    attempts
    writerToken
    error
    version
    created
    modified
    result {
        key
        storageKey
        path
        manifest {
            id sourceId database created completed snapshotId snapshot
            serverVersion serverVersionNumber encoding extensions requiredKeys
            length sha256 payloadPath version format
        }
    }
}
