[project]
name = "bosca-recommendation-trainer"
version = "0.1.0"
description = "TFRS two-tower model trainer for Bosca content recommendations. Connects to Trino for interaction data, trains a retrieval model, and uploads artifacts to Bosca's content storage."
requires-python = ">=3.12"
dependencies = [
    "tensorflow>=2.15.0",
    "tensorflow-recommenders>=0.7.3",
    # ScaNN only ships Linux/x86_64 wheels and is only used on the use_scann serving path (the trainer
    # image is linux/amd64). Local dev + tests use BruteForce, so keep it off non-Linux resolves.
    "scann>=1.3.0 ; sys_platform == 'linux'",
    "trino[sqlalchemy]>=0.328.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
]

[project.scripts]
recommendation-trainer = "train:main"

# Test-only deps. The Dockerfile syncs with --no-dev, so these never ship in the trainer image.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The trainer is a flat-module application (train.py + trainer/ + bosca_storage.py), run via the venv
# interpreter directly — never built or installed as a wheel (the Dockerfile uses --no-install-project and
# invokes python directly). Declaring it non-packaged stops `uv run`/`uv sync` from trying to hatch-build
# it, which fails because there is no package dir named after the project.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]

[tool.coverage.run]
branch = true
source = ["trainer"]

[tool.coverage.report]
show_missing = true
