[package]
name = "bosca-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "bosca_gateway"
path = "src/lib.rs"

[[bin]]
name = "bosca-gateway"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }
futures = "0.3"

# Web framework & HTTP
axum = { version = "0.7", features = ["http2", "macros", "ws"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# HTTP client (upstream proxying)
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls", "json", "stream", "cookies"
] }

# Auth
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
base64 = "0.22"
percent-encoding = "2"

# Config
toml = "0.8"
arc-swap = "1"

# Data formats
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

# Time & IDs
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Caching
moka = { version = "0.12", features = ["future"] }

# CIDR matching for the trusted-proxies allowlist
ipnet = "2"

# Error handling
thiserror = "2"
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.14"

# HTTP types
http = "1"
http-body = "1"
http-body-util = "0.1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Crypto (session cookies)
aes-gcm = "0.10"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Memory allocator
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
tempfile = "3"
